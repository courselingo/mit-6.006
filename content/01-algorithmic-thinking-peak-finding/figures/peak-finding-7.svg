<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 226" width="760" height="226"
     role="img" aria-labelledby="fig-peak-finding-7-title fig-peak-finding-7-desc">
  <title id="fig-peak-finding-7-title">按列二分：中间列取最大值，至多保留一半列</title>
  <desc id="fig-peak-finding-7-desc">候选列先取中间那一列的最大值，再与左右相邻列比较：左边更大就保留左半边的列，右边更大就保留右半边的列，列数每轮至少减半；左边面板到右边面板由一个箭头连起来。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="226" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">按列二分：中间列取最大值，至多保留一半列</text>
  <rect x="38" y="92" width="52" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="64" y="114" font-size="12" fill="#1e40af" text-anchor="middle">列 1</text>
  <rect x="115" y="92" width="52" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="141" y="114" font-size="12" fill="#1e40af" text-anchor="middle">列 2</text>
  <rect x="192" y="92" width="52" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="218" y="114" font-size="12" fill="#166534" text-anchor="middle">中列</text>
  <rect x="269" y="92" width="52" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="295" y="114" font-size="12" fill="#1e40af" text-anchor="middle">列 4</text>
  <rect x="346" y="92" width="52" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="372" y="114" font-size="12" fill="#1e40af" text-anchor="middle">列 5</text>
  <rect x="22" y="64" width="392" height="140" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="32" y="80" font-size="11" fill="#64748b">当前的候选列</text>
  <text x="218" y="168" font-size="10" fill="#64748b" text-anchor="middle">中列先取这一列的最大值</text>
  <rect x="444" y="64" width="294" height="140" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="454" y="80" font-size="11" fill="#64748b">下一步</text>
  <path d="M419,134 L 433,134" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <text x="460" y="100" font-size="11" fill="#1e293b" text-anchor="start">左边相邻列更大 → 去左半边</text>
  <text x="460" y="128" font-size="11" fill="#1e293b" text-anchor="start">右边相邻列更大 → 去右半边</text>
  <text x="460" y="156" font-size="11" fill="#1e293b" text-anchor="start">两边都不大 → 中列最大值那一点就是峰</text>
  <text x="460" y="184" font-size="11" fill="#64748b" text-anchor="start">列数每轮至少减半</text>
</svg>
