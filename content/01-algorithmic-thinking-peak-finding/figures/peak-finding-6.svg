<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" height="268"
     role="img" aria-labelledby="fig-peak-finding-6-title fig-peak-finding-6-desc">
  <title id="fig-peak-finding-6-title">二维贪心上升：一路移向更大的邻居</title>
  <desc id="fig-peak-finding-6-desc">3 乘 3 矩阵从左上角的 1 出发，先向下移到 4，再向右移到 9，9 不小于四个邻居所以停下；路径长度没有保证。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="268" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">二维贪心上升：一路移向更大的邻居</text>
  <rect x="22" y="70" width="110" height="42" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="77" y="96" font-size="14" fill="#6b21a8" text-anchor="middle">1</text>
  <rect x="157" y="70" width="110" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="212" y="96" font-size="14" fill="#1e40af" text-anchor="middle">3</text>
  <rect x="292" y="70" width="110" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="347" y="96" font-size="14" fill="#1e40af" text-anchor="middle">2</text>
  <rect x="22" y="137" width="110" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="77" y="163" font-size="14" fill="#1e40af" text-anchor="middle">4</text>
  <rect x="157" y="137" width="110" height="42" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="212" y="163" font-size="14" fill="#166534" text-anchor="middle">9</text>
  <rect x="292" y="137" width="110" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="347" y="163" font-size="14" fill="#1e40af" text-anchor="middle">5</text>
  <rect x="22" y="204" width="110" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="77" y="230" font-size="14" fill="#1e40af" text-anchor="middle">6</text>
  <rect x="157" y="204" width="110" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="212" y="230" font-size="14" fill="#1e40af" text-anchor="middle">8</text>
  <rect x="292" y="204" width="110" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="347" y="230" font-size="14" fill="#1e40af" text-anchor="middle">7</text>
  <path d="M77,117 L 77,126" fill="none" stroke="#a855f7" marker-end="url(#arrow-purple)"/>
  <path d="M137,158 L 146,158" fill="none" stroke="#a855f7" marker-end="url(#arrow-purple)"/>
  <rect x="430" y="70" width="308" height="176" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="440" y="86" font-size="11" fill="#64748b">贪心上升的三句话</text>
  <text x="440" y="118" font-size="12" fill="#1e293b" text-anchor="start">每步只移向更大的邻居</text>
  <text x="440" y="148" font-size="12" fill="#1e293b" text-anchor="start">数值有限，所以一定会停</text>
  <text x="440" y="178" font-size="12" fill="#1e293b" text-anchor="start">停下来就是二维峰</text>
  <text x="440" y="208" font-size="10" fill="#64748b" text-anchor="start">紫 = 起点，绿 = 停下的峰</text>
</svg>
