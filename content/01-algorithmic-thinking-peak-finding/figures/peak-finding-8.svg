<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" width="760" height="276"
     role="img" aria-labelledby="fig-peak-finding-8-title fig-peak-finding-8-desc">
  <title id="fig-peak-finding-8-title">二分峰值查找的边界：四类场景两两对照</title>
  <desc id="fig-peak-finding-8-desc">左边两类场景二分成立：数据放在数组里能随机访问，任务只要任意一个峰；右边两类失效：链表取中间要 Θ(n)，要最高峰则必须扫一遍。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="276" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">二分峰值查找的边界：四类场景两两对照</text>
  <rect x="22" y="64" width="350" height="190" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="32" y="80" font-size="11" fill="#64748b">成立的条件</text>
  <rect x="388" y="64" width="350" height="190" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="398" y="80" font-size="11" fill="#64748b">管不了的情形</text>
  <rect x="38" y="100" width="318" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="197" y="122" font-size="12" fill="#1e40af" text-anchor="middle">数组存储</text>
  <text x="197" y="140" font-size="12" fill="#1e40af" text-anchor="middle">下标一算就到中间</text>
  <rect x="38" y="179" width="318" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="197" y="201" font-size="12" fill="#1e40af" text-anchor="middle">只要任意一个峰</text>
  <text x="197" y="219" font-size="12" fill="#1e40af" text-anchor="middle">不做额外要求</text>
  <rect x="404" y="100" width="318" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563" y="122" font-size="12" fill="#9d174d" text-anchor="middle">链表存储</text>
  <text x="563" y="140" font-size="12" fill="#9d174d" text-anchor="middle">取中间本身就要 Θ(n)</text>
  <rect x="404" y="179" width="318" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563" y="201" font-size="12" fill="#9d174d" text-anchor="middle">要求最高峰</text>
  <text x="563" y="219" font-size="12" fill="#9d174d" text-anchor="middle">只能从头扫一遍 Θ(n)</text>
</svg>
