<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 305" width="760" height="305"
     role="img" aria-labelledby="fig-peak-finding-5-title fig-peak-finding-5-desc">
  <title id="fig-peak-finding-5-title">把递推式展开：每层一个 Θ(1)，一共 log₂n 层</title>
  <desc id="fig-peak-finding-5-desc">T(n) 每次减半直到 T(1)，共 log₂n 层，每层一次比较的代价 Θ(1)，相乘得到 Θ(log n)。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="305" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">把递推式展开：每层一个 Θ(1)，一共 log₂n 层</text>
  <rect x="22" y="64" width="260" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="152" y="86" font-size="12" fill="#1e40af" text-anchor="middle">T(n) = T(n/2) + Θ(1)</text>
  <path d="M152,105 L 152,114" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="22" y="125" width="260" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="152" y="147" font-size="12" fill="#1e40af" text-anchor="middle">T(n/2) = T(n/4) + Θ(1)</text>
  <path d="M152,166 L 152,175" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="22" y="186" width="260" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="152" y="208" font-size="12" fill="#b45309" text-anchor="middle">⋮ 每次规模减半</text>
  <path d="M152,227 L 152,236" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="22" y="247" width="260" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="152" y="269" font-size="12" fill="#166534" text-anchor="middle">T(1) = Θ(1)，结束</text>
  <rect x="330" y="125" width="408" height="126" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="340" y="141" font-size="11" fill="#64748b">逐层相加</text>
  <text x="540" y="170" font-size="12" fill="#1e293b" text-anchor="end">层数 =</text>
  <text x="552" y="170" font-size="12" fill="#1e293b" text-anchor="start">log₂n</text>
  <text x="540" y="197" font-size="12" fill="#1e293b" text-anchor="end">每层代价 =</text>
  <text x="552" y="197" font-size="12" fill="#1e293b" text-anchor="start">Θ(1)</text>
  <text x="540" y="224" font-size="12" fill="#1e293b" text-anchor="end">总代价 =</text>
  <text x="552" y="224" font-size="12" fill="#1e293b" text-anchor="start">Θ(log n)</text>
</svg>
