<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" width="760" height="196"
     role="img" aria-labelledby="fig-peak-finding-1-title fig-peak-finding-1-desc">
  <title id="fig-peak-finding-1-title">一维数组里的峰：不小于左右邻居的元素</title>
  <desc id="fig-peak-finding-1-desc">8 个元素的数组，位置 3 的 7 与位置 5 的 9 都不小于左右邻居，因此都是峰；两个端点各只有一个邻居。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="196" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一维数组里的峰：不小于左右邻居的元素</text>
  <rect x="24.5" y="76" width="67" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="58" y="102" font-size="14" fill="#1e40af" text-anchor="middle">6</text>
  <text x="58" y="138" font-size="10" fill="#64748b" text-anchor="middle">1</text>
  <rect x="116.5" y="76" width="67" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="150" y="102" font-size="14" fill="#1e40af" text-anchor="middle">4</text>
  <text x="150" y="138" font-size="10" fill="#64748b" text-anchor="middle">2</text>
  <rect x="208.5" y="76" width="67" height="42" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="242" y="102" font-size="14" fill="#166534" text-anchor="middle">7</text>
  <text x="242" y="138" font-size="10" fill="#64748b" text-anchor="middle">3</text>
  <rect x="300.5" y="76" width="67" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="334" y="102" font-size="14" fill="#1e40af" text-anchor="middle">2</text>
  <text x="334" y="138" font-size="10" fill="#64748b" text-anchor="middle">4</text>
  <rect x="392.5" y="76" width="67" height="42" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="426" y="102" font-size="14" fill="#166534" text-anchor="middle">9</text>
  <text x="426" y="138" font-size="10" fill="#64748b" text-anchor="middle">5</text>
  <rect x="484.5" y="76" width="67" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="518" y="102" font-size="14" fill="#1e40af" text-anchor="middle">1</text>
  <text x="518" y="138" font-size="10" fill="#64748b" text-anchor="middle">6</text>
  <rect x="576.5" y="76" width="67" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="610" y="102" font-size="14" fill="#1e40af" text-anchor="middle">5</text>
  <text x="610" y="138" font-size="10" fill="#64748b" text-anchor="middle">7</text>
  <rect x="668.5" y="76" width="67" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="702" y="102" font-size="14" fill="#1e40af" text-anchor="middle">3</text>
  <text x="702" y="138" font-size="10" fill="#64748b" text-anchor="middle">8</text>
  <text x="380" y="172" font-size="10" fill="#64748b" text-anchor="middle">非端点的元素要和左右两个邻居比；位置 1 与位置 8 只有一个邻居</text>
</svg>
