<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" width="760" height="389"
     role="img" aria-labelledby="fig-dp22-tetris-title fig-dp22-tetris-desc">
  <title id="fig-dp22-tetris-title">俄罗斯方块：把「每列高度」作为状态之后有 O(n·h^w) 个子问题，而指数长在棋盘宽度上</title>
  <desc id="fig-dp22-tetris-desc">俄罗斯方块训练给定 n 个方块与宽度很小 w 的空棋盘，出路是先加两条人为限制（空棋盘、整行不消除），因为去掉它们就不会做、相关情形还是 NP 完全的；第一次尝试只取后缀是否存活，缺少每列高度这个状态；正确做法把「每列当前高度」当作状态，于是有 O(n·h^w) 个子问题、总时间 O(n·w·h^w)。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="389" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">俄罗斯方块：把「每列高度」作为状态之后有 O(n·h^w) 个子问题，而指数长在棋盘宽度上</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">设定：n 个方块、宽度很小的空棋盘；每个方块要选朝向与横坐标，然后下落到底</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="147" font-size="12" fill="#9d174d" text-anchor="middle">两条人为限制：棋盘一开始是空的、整行不会消除 —— 讲义明说去掉它们就不知道怎么做</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="208" font-size="12" fill="#9d174d" text-anchor="middle">（并注明：如果棋盘非空且宽度大，这个问题是 NP 完全的）</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="269" font-size="12" fill="#9d174d" text-anchor="middle">第一次尝试：子问题只取「后缀 i 能否存活」⇒ 不知道每一列已经堆到多高，信息不够</text>
  <rect x="22" y="308" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="330" font-size="12" fill="#166534" text-anchor="middle">正确做法：状态加上「每列的当前高度 h」⇒ O(n·h^w) 个子问题；总时间 O(n·w·h^w)；解是 DP[0, 0]</text>
  <text x="380" y="366" font-size="10" fill="#64748b" text-anchor="middle">注意那个 h^w：指数长在棋盘的宽度上，所以讲义强调「宽度很小」</text>
</svg>
