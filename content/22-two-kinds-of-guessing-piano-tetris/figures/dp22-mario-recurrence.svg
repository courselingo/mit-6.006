<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 269" width="760" height="269"
     role="img" aria-labelledby="fig-dp22-mario-recurrence-title fig-dp22-mario-recurrence-desc">
  <title id="fig-dp22-mario-recurrence-title">同一个递推的三层复杂度：对分数与时间是伪多项式、对关卡长度是多项式、对屏幕尺寸是指数</title>
  <desc id="fig-dp22-mario-recurrence-desc">超级马里奥那个 DP 的复杂度分三层：对分数上限与时间上限是伪多项式，对关卡长度是多项式，而对屏幕尺寸是指数级，因此这个算法只在屏幕很小时可用。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="269" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">同一个递推的三层复杂度：对分数与时间是伪多项式、对关卡长度是多项式、对屏幕尺寸是指数</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="86" font-size="12" fill="#9d174d" text-anchor="middle">对分数上限 S 与时间上限 T：伪多项式（第 21 讲那个概念）</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="147" font-size="12" fill="#166534" text-anchor="middle">对关卡长度 n：多项式</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="208" font-size="12" fill="#9d174d" text-anchor="middle">对屏幕尺寸 w·h：指数 —— 所以这个算法只在屏幕很小时可用</text>
  <text x="380" y="244" font-size="10" fill="#64748b" text-anchor="middle">同一份代码，换一个参数看就是另一个量级</text>
</svg>
