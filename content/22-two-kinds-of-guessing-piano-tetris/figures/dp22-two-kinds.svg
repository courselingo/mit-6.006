<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 269" width="760" height="269"
     role="img" aria-labelledby="fig-dp22-two-kinds-title fig-dp22-two-kinds-desc">
  <title id="fig-dp22-two-kinds-title">两类猜测：A 类在第 3 步挑用哪些子问题，B 类在第 1 步造出更多子问题</title>
  <desc id="fig-dp22-two-kinds-desc">动态规划的猜测有两类：A 类发生在第 3 步，猜这个子问题该用哪些别的子问题，除 Fibonacci 外每个 DP 都用；B 类发生在第 1 步，通过造出更多子问题来记住解的更多结构，背包、最短路加边数、指法加手指都属于这一类。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="269" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两类猜测：A 类在第 3 步挑用哪些子问题，B 类在第 1 步造出更多子问题</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">A 类：在第 3 步猜「这个子问题该用哪些别的子问题」——除 Fibonacci 外每个 DP 都用</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="147" font-size="12" fill="#b45309" text-anchor="middle">B 类：在第 1 步造出更多子问题，好把解的更多结构一起报上来</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="208" font-size="12" fill="#166534" text-anchor="middle">背包、最短路加边数、指法加上一根手指，用的都是 B 类</text>
  <text x="380" y="244" font-size="10" fill="#64748b" text-anchor="middle">A 类在已有的子问题之间挑，B 类先改变子问题的集合</text>
</svg>
