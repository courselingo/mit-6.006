<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 165" width="760" height="165"
     role="img" aria-labelledby="fig-scheduling-problem-title fig-scheduling-problem-desc">
  <title id="fig-scheduling-problem-title">排班流程：请求、k 分钟互斥检查、插入集合、起飞取最早</title>
  <desc id="fig-scheduling-problem-desc">排班系统维护一个集合 R：每来一个请求先做 k 分钟互斥检查，通过就插入 R；要起飞时取最早的时刻。讲义的目标是让整套系统在 O(lg n) 时间内运行。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="165" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">排班流程：请求、k 分钟互斥检查、插入集合、起飞取最早</text>
  <rect x="22" y="64" width="160.25" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="102.125" y="84" font-size="11" fill="#1e40af" text-anchor="middle">请求时刻 t</text>
  <text x="102.125" y="101" font-size="11" fill="#1e40af" text-anchor="middle">飞机报一个想落的点</text>
  <rect x="207.25" y="64" width="160.25" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="287.375" y="84" font-size="11" fill="#b45309" text-anchor="middle">k 分钟互斥检查</text>
  <text x="287.375" y="101" font-size="11" fill="#b45309" text-anchor="middle">和 R 里最近的比一比</text>
  <path d="M187.25,88 L 196.25,88" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="392.5" y="64" width="160.25" height="49.5" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="472.625" y="84" font-size="11" fill="#9d174d" text-anchor="middle">插入集合 R</text>
  <text x="472.625" y="101" font-size="11" fill="#9d174d" text-anchor="middle">这一步要快</text>
  <path d="M372.5,88 L 381.5,88" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="577.75" y="64" width="160.25" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="657.875" y="84" font-size="11" fill="#166534" text-anchor="middle">起飞时取最早</text>
  <text x="657.875" y="101" font-size="11" fill="#166534" text-anchor="middle">取表头，然后删掉</text>
  <path d="M557.75,88 L 566.75,88" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <text x="380" y="140" font-size="10" fill="#64748b" text-anchor="middle">全程都围着集合 R 转：安全检查要快，插入也要快</text>
</svg>
