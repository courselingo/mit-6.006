<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" width="760" height="389"
     role="img" aria-labelledby="fig-structure-tradeoffs-title fig-structure-tradeoffs-desc">
  <title id="fig-structure-tradeoffs-title">五种候选结构的两项代价：没有一种同时擅长插入与 k 分钟检查</title>
  <desc id="fig-structure-tradeoffs-desc">讲义逐条比较了五种结构：有序表、有序数组、无序表或数组、最小堆、字典或 Python set；每一种都只擅长插入与检查中的一件，于是留下「需要往有序结构里快速插入」这个缺口。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="389" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">五种候选结构的两项代价：没有一种同时擅长插入与 k 分钟检查</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">有序表：插入 Θ(n)，检查 O(1)（找到插入点之后）</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="147" font-size="12" fill="#1e40af" text-anchor="middle">有序数组：插入要搬元素 Θ(n)，检查可用二分 O(lg n)</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="208" font-size="12" fill="#b45309" text-anchor="middle">无序表或数组：插入方便，检查要扫一遍 O(n)</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="269" font-size="12" fill="#9d174d" text-anchor="middle">最小堆：插入 O(lg n)，但检查要 O(n)</text>
  <rect x="22" y="308" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="330" font-size="12" fill="#9d174d" text-anchor="middle">字典或 Python set：插入 O(1)，检查最坏 Ω(n)</text>
  <text x="380" y="366" font-size="10" fill="#64748b" text-anchor="middle">没有一种结构同时擅长两件事，缺口就在这里</text>
</svg>
