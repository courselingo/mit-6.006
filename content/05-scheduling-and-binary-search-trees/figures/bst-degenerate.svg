<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384"
     role="img" aria-labelledby="fig-bst-degenerate-title fig-bst-degenerate-desc">
  <title id="fig-bst-degenerate-title">顺序插入的退化：树变成一条链，代价从 O(lg n) 滑到 O(n)</title>
  <desc id="fig-bst-degenerate-desc">若按从小到大依次插入，每个新元素都比上一个大，于是永远只往右走，树退化成一个链表形状；此时高度 h = n，所有操作从 O(lg n) 变成 O(n)。讲义因此把平衡 BST 留到下一讲。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="384" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">顺序插入的退化：树变成一条链，代价从 O(lg n) 滑到 O(n)</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">按从小到大插入 46 ⇒ 它当根</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="147" font-size="12" fill="#1e40af" text-anchor="middle">插入 43 ⇒ 比 46 小，往左，挂在 46 左边</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="208" font-size="12" fill="#1e40af" text-anchor="middle">插入 49 ⇒ 比 46 大，往右，挂在 46 右边，而且它没有左孩子</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="269" font-size="12" fill="#1e40af" text-anchor="middle">插入 55 ⇒ 比 46 大、比 49 还大，继续往右</text>
  <rect x="22" y="308" width="716" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="330" font-size="12" fill="#9d174d" text-anchor="middle">形状变成一条链：每个节点只有一个孩子</text>
  <text x="380" y="348" font-size="12" fill="#9d174d" text-anchor="middle">高度 h = n ⇒ 操作从 O(lg n) 滑到 O(n)</text>
</svg>
