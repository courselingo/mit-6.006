<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 434" width="760" height="434"
     role="img" aria-labelledby="fig-avl-condition-title fig-avl-condition-desc">
  <title id="fig-avl-condition-title">AVL 的条件：左右子树的高度差不超过 1</title>
  <desc id="fig-avl-condition-desc">根节点 x 的左子树高度是 k−1、右子树高度是 k，差正好是 1，这是允许的极限；空树（nil）的高度规定为 −1，每个节点还要多存一个自己的高度。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="434" fill="#ffffff"/>
  <text x="380.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">AVL 的条件：左右子树的高度差不超过 1</text>
  <g transform="translate(0.0,-18.0)">
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">对每个节点：左子树高度与右子树高度之差 ≤ 1，超过就违规（差 0 或 ±1 都合法）</text>
  <path d="M359.8,222.2 C 336.0,230.5 306.2,263.3 300.2,287.8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M400.2,222.2 C 424.0,230.5 453.8,263.3 459.8,287.8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="380" cy="200" r="30" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="380" y="204.2" font-size="12" fill="#1e40af" text-anchor="middle">x</text>
  <circle cx="280" cy="310" r="30" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="280" y="314.2" font-size="12" fill="#1e40af" text-anchor="middle">k−1</text>
  <circle cx="480" cy="310" r="30" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="314.2" font-size="12" fill="#1e40af" text-anchor="middle">k</text>
  <text x="380" y="400" font-size="10" fill="#64748b" text-anchor="middle">两棵子树的高度差 = k − (k−1) = 1，正好卡在上限</text>
  <text x="380" y="428" font-size="10" fill="#64748b" text-anchor="middle">nil 树的高度记为 −1；每个节点多存一个高度值，也可以只存左右高度之差</text>
  </g>
</svg>
