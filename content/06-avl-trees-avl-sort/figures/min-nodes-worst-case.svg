<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 370" width="828" height="370"
     role="img" aria-labelledby="fig-min-nodes-worst-case-title fig-min-nodes-worst-case-desc">
  <title id="fig-min-nodes-worst-case-title">最瘦的 AVL 树有多少个节点</title>
  <desc id="fig-min-nodes-worst-case-desc">每一层都取高度差 1 的时候节点最少：N(h) = N(h−1) + N(h−2) + 1，长成斐波那契的样子（N(h) = F(h+2) − 1），于是粗界是 h &lt; 2 lg n，紧界是 h ≈ 1.440 lg n。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="828" height="370" fill="#ffffff"/>
  <text x="413.8" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">最瘦的 AVL 树有多少个节点</text>
  <g transform="translate(-18.0,-54.0)">
  <path d="M181.0,153.2 C 158.7,161.5 132.7,193.3 129.0,216.8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M220.2,152.2 C 244.0,160.5 273.8,193.3 279.8,217.8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M99.7,268.2 C 83.6,277.5 73.8,304.3 80.3,321.8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M126.1,265.3 C 145.7,273.7 164.6,303.4 163.9,324.7" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="200" cy="130" r="30" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="200" y="134.2" font-size="12" fill="#1e40af" text-anchor="middle">h</text>
  <circle cx="110" cy="240" r="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="110" y="244.2" font-size="12" fill="#b45309" text-anchor="middle">h−1</text>
  <circle cx="300" cy="240" r="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="300" y="244.2" font-size="12" fill="#b45309" text-anchor="middle">h−2</text>
  <circle cx="70" cy="350" r="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="70" y="354.2" font-size="12" fill="#b45309" text-anchor="middle">h−2</text>
  <circle cx="180" cy="350" r="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="180" y="354.2" font-size="12" fill="#b45309" text-anchor="middle">h−3</text>
  <rect x="452" y="112.25" width="371.66" height="211" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="470" y="140" font-size="13" fill="#1e293b" text-anchor="start">N(h) = N(h−1) + N(h−2) + 1</text>
  <text x="470" y="178" font-size="13" fill="#1e293b" text-anchor="start">&gt; 2 · N(h−2)   ⇒   N(h) &gt; 2^(h/2)</text>
  <text x="470" y="216" font-size="13" fill="#1e293b" text-anchor="start">⇒   h &lt; 2 lg N(h)  ——  这是容易证的粗界</text>
  <text x="470" y="264" font-size="13" fill="#b45309" text-anchor="start">更紧的一条路：N(h) &gt; F(h)，且 N(h) = F(h+2) − 1</text>
  <text x="470" y="302" font-size="13" fill="#b45309" text-anchor="start">⇒   最大高度 ≈ log n（以 φ 为底）≈ 1.440 lg n</text>
  <text x="370" y="400" font-size="10" fill="#64748b" text-anchor="middle">左边这棵树的节点数正好就是 N(h)：每个节点都让左右高度差 1</text>
  </g>
</svg>
