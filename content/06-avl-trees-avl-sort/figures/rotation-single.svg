<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 706 406" width="706" height="406"
     role="img" aria-labelledby="fig-rotation-single-title fig-rotation-single-desc">
  <title id="fig-rotation-single-title">单旋：x 的右孩子也右重或两边一样高，转一次就够</title>
  <desc id="fig-rotation-single-desc">左图里 x 右重、右孩子 y 也右重或两边一样高；绕 x 做一次左旋，y 升上来当根，x 变成 y 的左孩子，A、B、C 三棵子树各自换了位置。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="706" height="406" fill="#ffffff"/>
  <text x="353.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">单旋：x 的右孩子也右重或两边一样高，转一次就够</text>
  <g transform="translate(-42.0,-58.0)">
  <path d="M154.7,151.0 C 132.6,161.0 107.9,194.9 105.3,219.0" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M187.0,149.7 C 211.3,159.5 241.8,194.8 248.0,220.3" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M251.8,262.4 C 231.8,272.6 212.5,305.2 213.2,327.6" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M278.2,262.4 C 298.2,272.6 317.5,305.2 316.8,327.6" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M606.8,152.4 C 586.8,162.6 567.5,195.2 568.2,217.6" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M635.3,151.0 C 657.4,161.0 682.1,194.9 684.7,219.0" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M541.8,262.4 C 521.8,272.6 502.5,305.2 503.2,327.6" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M568.2,262.4 C 588.2,272.6 607.5,305.2 606.8,327.6" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="170" cy="130" r="26" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="170" y="134.2" font-size="12" fill="#1e40af" text-anchor="middle">x</text>
  <circle cx="90" cy="240" r="26" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="90" y="244.2" font-size="12" fill="#1e40af" text-anchor="middle">A</text>
  <circle cx="265" cy="240" r="26" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="265" y="244.2" font-size="12" fill="#9d174d" text-anchor="middle">y</text>
  <circle cx="200" cy="350" r="26" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="200" y="354.2" font-size="12" fill="#1e40af" text-anchor="middle">B</text>
  <circle cx="330" cy="350" r="26" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="330" y="354.2" font-size="12" fill="#1e40af" text-anchor="middle">C</text>
  <circle cx="620" cy="130" r="26" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="620" y="134.2" font-size="12" fill="#166534" text-anchor="middle">y</text>
  <circle cx="555" cy="240" r="26" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="555" y="244.2" font-size="12" fill="#1e40af" text-anchor="middle">x</text>
  <circle cx="700" cy="240" r="26" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="700" y="244.2" font-size="12" fill="#1e40af" text-anchor="middle">C</text>
  <circle cx="490" cy="350" r="26" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="490" y="354.2" font-size="12" fill="#1e40af" text-anchor="middle">A</text>
  <circle cx="620" cy="350" r="26" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="620" y="354.2" font-size="12" fill="#1e40af" text-anchor="middle">B</text>
  <path d="M362,240 L452,240" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <text x="415" y="216" font-size="11" fill="#1f2937" text-anchor="middle">左旋 Left-Rotate(x)</text>
  <text x="395" y="440" font-size="10" fill="#64748b" text-anchor="middle">一次旋转只动三个节点：x、y、y 中间那棵子树 B；其余节点一个都不碰</text>
  </g>
</svg>
