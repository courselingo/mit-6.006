<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310"
     role="img" aria-labelledby="fig-avl-sort-cost-title fig-avl-sort-cost-desc">
  <title id="fig-avl-sort-cost-title">AVL sort：插入 n 次，再中序遍历一次</title>
  <desc id="fig-avl-sort-cost-desc">AVL sort 只有两步：把每个元素插进 AVL 树，每次插入 Θ(lg n)，n 次合计 Θ(n lg n)；再按中序遍历读出，花 Θ(n)。两项相加仍是 Θ(n lg n)。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="310" fill="#ffffff"/>
  <text x="380.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">AVL sort：插入 n 次，再中序遍历一次</text>
  <g transform="translate(0.0,0.0)">
  <rect x="22" y="46" width="716" height="136" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="40" y="64" width="680" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">第一步：把每个元素插进 AVL 树，n 次插入，每次 Θ(lg n)</text>
  <rect x="40" y="128" width="680" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="150.2" font-size="12" fill="#1e40af" text-anchor="middle">第二步：中序遍历，按从小到大读出来</text>
  <rect x="22" y="210" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="232.2" font-size="12" fill="#166534" text-anchor="middle">合计：Θ(n lg n) + Θ(n) = Θ(n lg n)</text>
  <text x="380" y="286" font-size="10" fill="#64748b" text-anchor="middle">代价和第 3 讲的归并排序同阶，但 AVL 树顺手把「有序 + 能查能插」都做到了</text>
  </g>
</svg>
