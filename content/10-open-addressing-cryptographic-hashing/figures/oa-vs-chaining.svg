<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440"
     role="img" aria-labelledby="fig-oa-vs-chaining-title fig-oa-vs-chaining-desc">
  <title id="fig-oa-vs-chaining-title">开放寻址与链地址法怎么选</title>
  <desc id="fig-oa-vs-chaining-desc">开放寻址赢在缓存与内存：元素挤在一段连续空间里，没有指针；代价是必须留空位，装填因子 α 不能到 1，约 70% 起明显变差。链地址法反过来：每个槽多一层指针，但撑得住 α 大于 1，对哈希函数也不挑。一句话：开放寻址拿「必须留余量」换更快的取用。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">开放寻址与链地址法怎么选</text>
  <rect x="22" y="68" width="344" height="268" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="394" y="68" width="344" height="268" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="39" y="104" width="310" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="411" y="104" width="310" height="54" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <rect x="39" y="183" width="310" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="411" y="183" width="310" height="54" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <rect x="39" y="262" width="310" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="411" y="262" width="310" height="54" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <rect x="22" y="364" width="716" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="32" y="84" font-size="12" fill="#64748b" text-anchor="start">开放寻址 open addressing</text>
  <text x="404" y="84" font-size="12" fill="#64748b" text-anchor="start">链地址法 chaining</text>
  <text x="194" y="126.2" font-size="12" fill="#1e40af" text-anchor="middle">缓存与内存：元素挤在一段连续空间里</text>
  <text x="194" y="144.2" font-size="12" fill="#1e40af" text-anchor="middle">没有指针，取用更快</text>
  <text x="566" y="126.2" font-size="12" fill="#1f2937" text-anchor="middle">缓存与内存：每个槽多一层指针</text>
  <text x="566" y="144.2" font-size="12" fill="#1f2937" text-anchor="middle">取用不如开放寻址紧凑</text>
  <text x="194" y="205.2" font-size="12" fill="#1e40af" text-anchor="middle">装填因子：必须留空位，α 越接近 1 越差</text>
  <text x="194" y="223.2" font-size="12" fill="#1e40af" text-anchor="middle">约 70% 起明显变差</text>
  <text x="566" y="205.2" font-size="12" fill="#1f2937" text-anchor="middle">装填因子：撑得住 α 大于 1</text>
  <text x="566" y="223.2" font-size="12" fill="#1f2937" text-anchor="middle">对哈希函数也不挑</text>
  <text x="194" y="284.2" font-size="12" fill="#1e40af" text-anchor="middle">实现：Python dict、Rust HashMap</text>
  <text x="194" y="302.2" font-size="12" fill="#1e40af" text-anchor="middle">以及 Google 的 absl 系列</text>
  <text x="566" y="284.2" font-size="12" fill="#1f2937" text-anchor="middle">实现：C++ 的 std::unordered_map</text>
  <text x="566" y="302.2" font-size="12" fill="#1f2937" text-anchor="middle">每个桶挂一条链</text>
  <text x="380" y="386.2" font-size="12" fill="#166534" text-anchor="middle">开放寻址拿「必须留余量」换更快的取用；链地址法允许装满甚至超载</text>
  <text x="380" y="404.2" font-size="12" fill="#166534" text-anchor="middle">代价是多一层指针与一次链上查找 —— 谁占便宜取决于表装得多满</text>
</svg>
