<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 467" width="480" height="467"
     role="img" aria-labelledby="fig-primary-clustering-title fig-primary-clustering-desc">
  <title id="fig-primary-clustering-title">线性探测：聚簇自己会长大</title>
  <desc id="fig-primary-clustering-desc">右边是表：槽 1、2、3 连着被占，这段连续的槽就是聚簇。左边三个键算出的位置都落在聚簇里，只能往后走：k3 一直走到聚簇尾部的空位，落在槽 4，聚簇就从 3 格长成 4 格。聚簇越长，挨着它的空槽越多，下一个键撞上它、并把它再拉长一格的机会就越大。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="480" height="467" fill="#ffffff"/>
  <text x="240" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">线性探测：聚簇自己会长大</text>
  <rect x="227" y="68" width="231" height="36" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <rect x="227" y="129" width="231" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <rect x="227" y="190" width="231" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <rect x="227" y="251" width="231" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <rect x="227" y="312" width="231" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <rect x="22" y="190" width="180" height="36" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <rect x="22" y="251" width="180" height="36" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <rect x="22" y="312" width="180" height="36" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <rect x="22" y="373" width="436" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="342.5" y="90.2" font-size="12" fill="#1f2937" text-anchor="middle">槽 0：空</text>
  <text x="342.5" y="151.2" font-size="12" fill="#b45309" text-anchor="middle">槽 1：item1</text>
  <text x="342.5" y="212.2" font-size="12" fill="#b45309" text-anchor="middle">槽 2：item4</text>
  <text x="342.5" y="273.2" font-size="12" fill="#b45309" text-anchor="middle">槽 3：item2</text>
  <text x="342.5" y="334.2" font-size="12" fill="#166534" text-anchor="middle">槽 4：k3（新）</text>
  <text x="112" y="212.2" font-size="12" fill="#1f2937" text-anchor="middle">k1：哈希位置被占</text>
  <text x="112" y="273.2" font-size="12" fill="#1f2937" text-anchor="middle">k2：哈希位置被占</text>
  <text x="112" y="334.2" font-size="12" fill="#1f2937" text-anchor="middle">k3：落到聚簇尾部</text>
  <text x="240" y="395.2" font-size="12" fill="#1e40af" text-anchor="middle">聚簇从 3 格长成 4 格：箭头落进来，聚簇就再长一格</text>
  <text x="240" y="413.2" font-size="12" fill="#1e40af" text-anchor="middle">聚簇越长，挨着它的空槽越多 ⇒ 下一个键撞上它的机会越大</text>
  <text x="240" y="431.2" font-size="12" fill="#1e40af" text-anchor="middle">撞上之后要走到聚簇尾部才有空位，代价跟着聚簇长度走</text>
  <path d="M207,208 L216,208" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M207,269 L216,269" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M207,330 L216,330" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
