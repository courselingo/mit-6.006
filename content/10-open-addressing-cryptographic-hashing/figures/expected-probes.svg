<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 284" width="760" height="284"
     role="img" aria-labelledby="fig-expected-probes-title fig-expected-probes-desc">
  <title id="fig-expected-probes-title">装填因子与期望探测次数</title>
  <desc id="fig-expected-probes-desc">期望探测次数是 1/(1−α)：α 取 0.5 时约 2 次，0.7 时约 3.33 次，0.9 时 10 次，0.99 时 100 次。α 从 0.9 只再加 0.09，代价就从 10 跳到 100，所以表越满，多留一点余量越值。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="284" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">装填因子与期望探测次数</text>
  <rect x="22" y="68" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="22" y="129" width="160" height="54" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <rect x="207" y="129" width="160" height="54" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <rect x="392" y="129" width="160" height="54" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <rect x="578" y="129" width="160" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <rect x="22" y="208" width="716" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="90.2" font-size="12" fill="#1e40af" text-anchor="middle">下次操作的期望代价不超过 1/(1−α)，其中 α = n/m 是装填因子</text>
  <text x="102" y="151.2" font-size="12" fill="#1f2937" text-anchor="middle">α = 0.5</text>
  <text x="102" y="169.2" font-size="12" fill="#1f2937" text-anchor="middle">期望 2 次</text>
  <text x="287" y="151.2" font-size="12" fill="#1f2937" text-anchor="middle">α = 0.7</text>
  <text x="287" y="169.2" font-size="12" fill="#1f2937" text-anchor="middle">期望约 3.33 次</text>
  <text x="472" y="151.2" font-size="12" fill="#1f2937" text-anchor="middle">α = 0.9</text>
  <text x="472" y="169.2" font-size="12" fill="#1f2937" text-anchor="middle">期望 10 次</text>
  <text x="658" y="151.2" font-size="12" fill="#b45309" text-anchor="middle">α = 0.99</text>
  <text x="658" y="169.2" font-size="12" fill="#b45309" text-anchor="middle">期望 100 次</text>
  <text x="380" y="230.2" font-size="12" fill="#166534" text-anchor="middle">α 从 0.9 再加 0.09，代价就从 10 跳到 100：表越满，余量越值钱</text>
  <text x="380" y="248.2" font-size="12" fill="#166534" text-anchor="middle">所以实践中不让表装得太满；讲义给的例子就是 α = 90% ⇒ 10 次期望探测</text>
</svg>
