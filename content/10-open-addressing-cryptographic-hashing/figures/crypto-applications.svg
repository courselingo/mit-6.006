<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 284" width="760" height="284"
     role="img" aria-labelledby="fig-crypto-applications-title fig-crypto-applications-desc">
  <title id="fig-crypto-applications-title">三个用途要的性质不同</title>
  <desc id="fig-crypto-applications-desc">存口令：存的是 h(PW)，用户输入 PW′ 时算 h(PW′) 比对，对手得反推原口令，所以要单向性。查文件改动：给每个文件存 h(F)，重算比对，对手的赢法是改了文件而不让哈希变，所以要目标抗碰撞性。数字签名：消息长就直接签 h(M)，对手若能造出撞上的 x′,就能冒名，所以要抗碰撞性。三条性质一条比一条强。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="284" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三个用途要的性质不同</text>
  <rect x="22" y="68" width="222" height="54" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <rect x="22" y="147" width="222" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <rect x="269" y="68" width="222" height="54" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <rect x="269" y="147" width="222" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <rect x="516" y="68" width="222" height="54" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <rect x="516" y="147" width="222" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <rect x="22" y="226" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="133" y="90.2" font-size="12" fill="#1f2937" text-anchor="middle">存口令</text>
  <text x="133" y="108.2" font-size="12" fill="#1f2937" text-anchor="middle">存 h(PW)，比 h(PW′)</text>
  <text x="133" y="169.2" font-size="12" fill="#b45309" text-anchor="middle">要单向性 OW</text>
  <text x="133" y="187.2" font-size="12" fill="#b45309" text-anchor="middle">对手得反推原口令</text>
  <text x="380" y="90.2" font-size="12" fill="#1f2937" text-anchor="middle">查文件改动</text>
  <text x="380" y="108.2" font-size="12" fill="#1f2937" text-anchor="middle">重算 h(F) 比一比</text>
  <text x="380" y="169.2" font-size="12" fill="#b45309" text-anchor="middle">要目标抗碰撞性 TCR</text>
  <text x="380" y="187.2" font-size="12" fill="#b45309" text-anchor="middle">改了文件但哈希值不变</text>
  <text x="627" y="90.2" font-size="12" fill="#1f2937" text-anchor="middle">数字签名</text>
  <text x="627" y="108.2" font-size="12" fill="#1f2937" text-anchor="middle">签 h(M)，不签整条 M</text>
  <text x="627" y="169.2" font-size="12" fill="#b45309" text-anchor="middle">要抗碰撞性 CR</text>
  <text x="627" y="187.2" font-size="12" fill="#b45309" text-anchor="middle">否则能冒名签别人的消息</text>
  <text x="380" y="248.2" font-size="12" fill="#166534" text-anchor="middle">三个用途要的性质一条比一条强：能反推就够的最省，能随便找一对才算破的最难守</text>
  <path d="M133,127 L133,136" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M380,127 L380,136" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M627,127 L627,136" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
