<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 205" width="760" height="205"
     role="img" aria-labelledby="fig-probe-sequence-title fig-probe-sequence-desc">
  <title id="fig-probe-sequence-title">探测序列：一串位置，一个排列</title>
  <desc id="fig-probe-sequence-desc">键 k 的探测序列是 h(k,0)、h(k,1) 一直排到 h(k,m−1)：第 0 次试槽 6，第 1 次试槽 2，第 2 次试槽 5，最后一次试槽 3。这串位置不重不漏地覆盖 0 到 m−1 的全部槽，所以 i 一路加上去，m 个槽一定会被全部试到。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="205" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">探测序列：一串位置，一个排列</text>
  <rect x="23" y="68" width="159" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="208" y="68" width="159" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="393" y="68" width="159" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="578" y="68" width="159" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <rect x="23" y="147" width="714" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="102.5" y="90.2" font-size="12" fill="#1e40af" text-anchor="middle">第 0 次试</text>
  <text x="102.5" y="108.2" font-size="12" fill="#1e40af" text-anchor="middle">落到槽 6</text>
  <text x="287.5" y="90.2" font-size="12" fill="#1e40af" text-anchor="middle">第 1 次试</text>
  <text x="287.5" y="108.2" font-size="12" fill="#1e40af" text-anchor="middle">落到槽 2</text>
  <text x="472.5" y="90.2" font-size="12" fill="#1e40af" text-anchor="middle">第 2 次试</text>
  <text x="472.5" y="108.2" font-size="12" fill="#1e40af" text-anchor="middle">落到槽 5</text>
  <text x="657.5" y="90.2" font-size="12" fill="#b45309" text-anchor="middle">第 m−1 次试</text>
  <text x="657.5" y="108.2" font-size="12" fill="#b45309" text-anchor="middle">落到槽 3</text>
  <text x="380" y="169.2" font-size="12" fill="#166534" text-anchor="middle">这串位置不重不漏地覆盖 0 到 m−1（例子里 m = 8）⇒ 一直试下去，m 个槽会被全部试到</text>
  <path d="M187,95 L197,95" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M372,95 L382,95" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M557,95 L567,95" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
