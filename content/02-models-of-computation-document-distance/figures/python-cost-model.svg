<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 229" width="760" height="229"
     role="img" aria-labelledby="fig-python-cost-model-title fig-python-cost-model-desc">
  <title id="fig-python-cost-model-title">Python 的两种模式：list 是数组，带属性的对象是指针机</title>
  <desc id="fig-python-cost-model-desc">Python 同时提供两种模式：list 是数组，随机寻址是 Θ(1)；带常数个属性的对象走引用，一步也是 Θ(1)。判断其它操作贵不贵，就看它按这两种方式实现出来要几步。注意 x in L 这类写法其实是一整轮扫描。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="229" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">Python 的两种模式：list 是数组，带属性的对象是指针机</text>
  <rect x="22" y="64" width="345.5" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194.75" y="86" font-size="12" fill="#1e40af" text-anchor="middle">list 实际上是一个数组</text>
  <text x="194.75" y="104" font-size="12" fill="#1e40af" text-anchor="middle">L[i] = L[j] + 5 → Θ(1)</text>
  <rect x="392.5" y="64" width="345.5" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="565.25" y="86" font-size="12" fill="#6b21a8" text-anchor="middle">带常数个属性的对象</text>
  <text x="565.25" y="104" font-size="12" fill="#6b21a8" text-anchor="middle">x = x.next → Θ(1)</text>
  <rect x="22" y="143" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="165" font-size="12" fill="#b45309" text-anchor="middle">判断贵不贵：想象它按这两种方式实现出来要几步</text>
  <text x="380" y="204" font-size="10" fill="#64748b" text-anchor="middle">x in L 与 L.index(x) 看起来像查询，其实是 Θ(|L|) 的一整轮扫描</text>
</svg>
