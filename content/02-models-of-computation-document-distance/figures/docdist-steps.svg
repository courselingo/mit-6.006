<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 225" width="760" height="225"
     role="img" aria-labelledby="fig-docdist-steps-title fig-docdist-steps-desc">
  <title id="fig-docdist-steps-title">文档距离的三步与各自代价：拆词、计数、点积</title>
  <desc id="fig-docdist-steps-desc">第一步把文档切成词，逐字符扫一遍是 Θ(|doc|)；第二步计数，排序法是 O(|doc| log |doc|)，字典法是 O(|doc|) 但只在高概率下成立；第三步算点积，双重循环是 O(u₁·u₂)，归并式是 O(u₁+u₂)，u 是不同词数。w.h.p. 说的是高概率成立，代价是期望代价，两者不是一回事。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="225" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">文档距离的三步与各自代价：拆词、计数、点积</text>
  <rect x="22" y="64" width="222" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="133" y="86" font-size="12" fill="#1e40af" text-anchor="middle">① 拆词</text>
  <rect x="269" y="64" width="222" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">② 计数</text>
  <rect x="516" y="64" width="222" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="627" y="86" font-size="12" fill="#1e40af" text-anchor="middle">③ 点积</text>
  <path d="M249,82 L 258,82" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M496,82 L 505,82" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="22" y="125" width="222" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="133" y="145" font-size="11" fill="#b45309" text-anchor="middle">逐字符扫一遍</text>
  <text x="133" y="162" font-size="11" fill="#b45309" text-anchor="middle">Θ(|doc|)，正则可能指数级</text>
  <rect x="269" y="125" width="222" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="145" font-size="11" fill="#b45309" text-anchor="middle">排序法 O(|doc| log |doc|)</text>
  <text x="380" y="162" font-size="11" fill="#b45309" text-anchor="middle">或字典法 O(|doc|) w.h.p.</text>
  <rect x="516" y="125" width="222" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="627" y="145" font-size="11" fill="#b45309" text-anchor="middle">双重循环 O(u₁·u₂)</text>
  <text x="627" y="162" font-size="11" fill="#b45309" text-anchor="middle">或归并式 O(u₁+u₂)，u 是不同词数</text>
  <text x="380" y="199" font-size="10" fill="#64748b" text-anchor="middle">第二步 w.h.p. 成立，代价是期望代价；这与最坏情况不是一回事</text>
</svg>
