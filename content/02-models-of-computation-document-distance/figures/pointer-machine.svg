<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 204" width="760" height="204"
     role="img" aria-labelledby="fig-pointer-machine-title fig-pointer-machine-desc">
  <title id="fig-pointer-machine-title">指针机：动态对象、常数个字段，字段是字或引用</title>
  <desc id="fig-pointer-machine-desc">指针机里只有动态分配出来的对象，每个对象有常数个字段，字段要么是一个字，要么是指向别的对象的引用。图中右框的 prev 指回左框，所以两条箭头方向相反，各与对应的字段行对齐。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="204" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">指针机：动态对象、常数个字段，字段是字或引用</text>
  <rect x="22" y="64" width="330" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="187" y="86" font-size="12" fill="#1e40af" text-anchor="middle">val = 5</text>
  <text x="187" y="104" font-size="12" fill="#1e40af" text-anchor="middle">prev = null</text>
  <text x="187" y="122" font-size="12" fill="#1e40af" text-anchor="middle">next = 引用</text>
  <rect x="377" y="64" width="361" height="72" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="557.5" y="86" font-size="12" fill="#6b21a8" text-anchor="middle">val = -1</text>
  <text x="557.5" y="104" font-size="12" fill="#6b21a8" text-anchor="middle">prev = 引用</text>
  <text x="557.5" y="122" font-size="12" fill="#6b21a8" text-anchor="middle">next = null</text>
  <path d="M357,131 L 366,131" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M372,95 L 363,95" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <text x="380" y="179" font-size="10" fill="#64748b" text-anchor="middle">两条箭头各自与字段行对齐：上一条是 next，下一条是 prev</text>
</svg>
