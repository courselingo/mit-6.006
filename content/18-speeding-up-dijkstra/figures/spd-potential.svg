<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" width="760" height="328"
     role="img" aria-labelledby="fig-spd-potential-title fig-spd-potential-desc">
  <title id="fig-spd-potential-title">势函数改权重：w' = w − λ(u) + λ(v)，路径上中间项抵消，所以路径之间的长短顺序不变</title>
  <desc id="fig-spd-potential-desc">A* 用顶点上的势函数把每条边改成 w'(u,v) = w(u,v) − λ(u) + λ(v)；沿路径累加时中间的势两两抵消，只剩 −λt(s) + λt(t) 这个常数，所以所有 s 到 t 路径的相对长短不变，仍然可以跑 Dijkstra。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="328" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">势函数改权重：w' = w − λ(u) + λ(v)，路径上中间项抵消，所以路径之间的长短顺序不变</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">势函数作用在顶点上：w'(u, v) = w(u, v) − λ(u) + λ(v)</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="147" font-size="12" fill="#b45309" text-anchor="middle">沿一条路径累加：w'(p) = w(p) − λt(s) + λt(t)，中间的势两两抵消</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="208" font-size="12" fill="#166534" text-anchor="middle">端点那两项对所有 s 到 t 的路径是同一个常数 ⇒ 路径之间的长短顺序不变</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="269" font-size="12" fill="#166534" text-anchor="middle">于是仍然跑 Dijkstra，只是换了一套权重（要求新权重非负）</text>
  <text x="380" y="305" font-size="10" fill="#64748b" text-anchor="middle">势函数只改变搜索往哪儿走，不改变哪条路最短</text>
</svg>
