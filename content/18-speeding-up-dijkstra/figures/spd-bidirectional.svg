<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 269" width="760" height="269"
     role="img" aria-labelledby="fig-spd-bidirectional-title fig-spd-bidirectional-desc">
  <title id="fig-spd-bidirectional-title">双向搜索：正向与反向两个搜索交替推进，直到某个顶点被两个队列都删掉</title>
  <desc id="fig-spd-bidirectional-desc">双向搜索同时从起点正向、从终点反向（沿边反着走）搜索，两边各维护一份距离 df 与 db；当某个顶点被两个队列都删掉时终止。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="269" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">双向搜索：正向与反向两个搜索交替推进，直到某个顶点被两个队列都删掉</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">正向从 s 搜，反向从 t 搜（沿边反着走），两个搜索交替推进</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="147" font-size="12" fill="#1e40af" text-anchor="middle">各自维护一份距离：df 属于正向，db 属于反向</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="208" font-size="12" fill="#166534" text-anchor="middle">终止条件：某个顶点被两个队列都删掉</text>
  <text x="380" y="244" font-size="10" fill="#64748b" text-anchor="middle">两个圆在中间相遇，访问的顶点数通常比单头搜索少</text>
</svg>
