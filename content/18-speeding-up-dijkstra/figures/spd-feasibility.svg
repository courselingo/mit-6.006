<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" width="760" height="328"
     role="img" aria-labelledby="fig-spd-feasibility-title fig-spd-feasibility-desc">
  <title id="fig-spd-feasibility-title">地标法：用 δ(u,l) − δ(t,l) 造势函数，可行性由三角不等式保证，多个地标取最大值也仍然可行</title>
  <desc id="fig-spd-feasibility-desc">地标是一小组顶点 L；对每个地标定义势函数 λt(l)(u) = δ(u,l) − δ(t,l)，代入后 w' 变成 w(u,v) − δ(u,l) + δ(v,l)，由三角不等式知其非负；把多个地标造的势取最大值也仍然可行。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="328" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">地标法：用 δ(u,l) − δ(t,l) 造势函数，可行性由三角不等式保证，多个地标取最大值也仍然可行</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">地标：取一小组顶点 L，预先算好每个 u 到每个地标 l 的 δ(u, l)</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="147" font-size="12" fill="#b45309" text-anchor="middle">每个地标造一份势：λt(l)(u) = δ(u, l) − δ(t, l)</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="208" font-size="12" fill="#166534" text-anchor="middle">可行性：w'(u, v) = w(u, v) − δ(u, l) + δ(v, l) ≥ 0，由三角不等式保证</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="269" font-size="12" fill="#166534" text-anchor="middle">多个地标取最大值 max λt(l)(u)，仍然可行</text>
  <text x="380" y="305" font-size="10" fill="#64748b" text-anchor="middle">所以势函数的可行性不是新条件，它就是三角不等式的另一个写法</text>
</svg>
