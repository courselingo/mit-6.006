  <title id="fig-radix-sort-example-title">基数排序走一遍：7 个三位数，按每一位从低到高排三次</title>
  <desc id="fig-radix-sort-example-desc">四个面板从左到右依次是：输入的 329 457 657 839 436 720 355；按最低位排完；按中间位排完；按最高位排完。最后两列写着每一轮用来排序的那一位，绿色写着此前已经排好的位；排完之后是 329 355 436 457 657 720 839。</desc>

