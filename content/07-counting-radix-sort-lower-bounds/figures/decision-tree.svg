<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390"
     role="img" aria-labelledby="fig-decision-tree-title fig-decision-tree-desc">
  <title id="fig-decision-tree-title">n = 3 时二分查找的判定树：4 片叶子对上 4 种可能答案</title>
  <desc id="fig-decision-tree-desc">根节点问 A1 是否小于 x，第二层再问 A0 或 A2，第三层四片叶子给出四种答案：x 不超过 A0、落在 A0 与 A1 之间、落在 A1 与 A2 之间、比 A2 还大。按图下的约定，向左的分支是 NO，向右的分支是 YES。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="390" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">n = 3 时二分查找的判定树：4 片叶子对上 4 种可能答案</text>

  <path d="M368,116 C 359.4,144.6 225.2,157.2 207.2,166.5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M392,116 C 400.6,144.6 534.8,157.2 552.8,166.5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M140.6,216 C 125.2,231.7 110.8,246.4 98.2,259.2" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M199.6,215.8 C 215.1,231.4 230.2,246.5 242.9,259.3" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M560.6,216 C 545.2,231.7 529.8,246.5 517.1,259.3" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M619.4,216 C 634.8,231.7 649.2,246.4 661.8,259.2" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <circle cx="380" cy="76" r="42" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="380" y="80" font-size="12" fill="#1e40af" text-anchor="middle">A1 &lt; x ?</text>
  <circle cx="170" cy="186" r="42" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="170" y="190" font-size="12" fill="#1e40af" text-anchor="middle">A0 &lt; x ?</text>
  <circle cx="590" cy="186" r="42" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="590" y="190" font-size="12" fill="#1e40af" text-anchor="middle">A2 &lt; x ?</text>

  <circle cx="66" cy="292" r="46" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="66" y="296" font-size="11" fill="#166534" text-anchor="middle">x ≤ A0</text>
  <circle cx="275.3" cy="292" r="46" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="275.3" y="296" font-size="11" fill="#166534" text-anchor="middle">A0 &lt; x ≤ A1</text>
  <circle cx="484.7" cy="292" r="46" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="484.7" y="296" font-size="11" fill="#166534" text-anchor="middle">A1 &lt; x ≤ A2</text>
  <circle cx="694" cy="292" r="46" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="694" y="296" font-size="11" fill="#166534" text-anchor="middle">A2 &lt; x</text>

  <text x="380" y="366" font-size="10" fill="#64748b" text-anchor="middle">约定向左的分支是 NO、向右的分支是 YES；根到叶的路径是一次执行，树高是最坏情况的运行时间</text>
</svg>
