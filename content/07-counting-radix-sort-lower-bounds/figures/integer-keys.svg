<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290"
     role="img" aria-labelledby="fig-integer-keys-title fig-integer-keys-desc">
  <title id="fig-integer-keys-title">整数键为什么能绕开下界：黑盒在这里变成了下标</title>
  <desc id="fig-integer-keys-desc">左右两列对照，中间一条虚线分开。左列是比较模型：元素是黑盒、只能问谁大谁小，所以逃不出 Ω(n lg n)。右列是整数键：键取自 0 到 k−1，它本身就能当下标直接寻址，下界管不着，代价可以做到 Θ(n+k)。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="290" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">整数键为什么能绕开下界：黑盒在这里变成了下标</text>

  <line x1="385" y1="60" x2="385" y2="240" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4"/>

  <rect x="20" y="64" width="350" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195" y="86" font-size="12" fill="#b45309" text-anchor="middle">比较模型：元素是黑盒</text>
  <rect x="20" y="130" width="350" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195" y="152" font-size="12" fill="#9d174d" text-anchor="middle">只能问：谁大谁小</text>
  <rect x="20" y="196" width="350" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195" y="218" font-size="12" fill="#9d174d" text-anchor="middle">所以逃不出 Ω(n lg n)</text>

  <rect x="400" y="64" width="340" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="570" y="86" font-size="12" fill="#1e40af" text-anchor="middle">整数键：取值 0 到 k−1</text>
  <rect x="400" y="130" width="340" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="570" y="152" font-size="12" fill="#1e40af" text-anchor="middle">键本身就能当下标直接寻址</text>
  <rect x="400" y="196" width="340" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="570" y="218" font-size="12" fill="#166534" text-anchor="middle">下界管不着，可以做到 Θ(n + k)</text>

  <path d="M195,105 L195,119" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M195,171 L195,185" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M570,105 L570,119" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M570,171 L570,185" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="380" y="264" font-size="10" fill="#64748b" text-anchor="middle">同一批数据，换一条「算法被允许做什么」的规定，能做到的代价就完全不同</text>
</svg>
