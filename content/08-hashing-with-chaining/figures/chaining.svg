<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 529 288" width="529" height="288"
     role="img" aria-labelledby="fig-chaining-title fig-chaining-desc">
  <title id="fig-chaining-title">链地址法：同一个槽里挂一条链表</title>
  <desc id="fig-chaining-desc">表的每个槽里挂一条链表，串起所有哈希到该槽的元素；槽 1 上挂着 k1、k2、k4，槽 2 上挂着 k3，查找要走完整条链。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="529" height="288" fill="#ffffff"/>
  <text x="264.5" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">链地址法：同一个槽里挂一条链表</text>
  <g transform="translate(22.0,46.0)">
  <rect x="0" y="0" width="110" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="55" y="22.2" font-size="12" fill="#1e40af" text-anchor="middle">槽 1</text>
  <rect x="0" y="61" width="110" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="55" y="83.2" font-size="12" fill="#1e40af" text-anchor="middle">槽 2</text>
  <rect x="0" y="122" width="110" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="55" y="144.2" font-size="12" fill="#1e40af" text-anchor="middle">槽 m−1</text>
  <rect x="135" y="0" width="100" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="185" y="22.2" font-size="12" fill="#b45309" text-anchor="middle">k1</text>
  <rect x="260" y="0" width="100" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="310" y="22.2" font-size="12" fill="#b45309" text-anchor="middle">k2</text>
  <rect x="385" y="0" width="100" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="435" y="22.2" font-size="12" fill="#b45309" text-anchor="middle">k4</text>
  <rect x="135" y="61" width="100" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="185" y="83.2" font-size="12" fill="#b45309" text-anchor="middle">k3</text>
  <path d="M115,18 L124,18" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M240,18 L249,18" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M365,18 L374,18" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M115,79 L124,79" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="242.5" y="218" font-size="10" fill="#64748b" text-anchor="middle">查找要走完整条链；最坏情况是所有 n 个键都落到同一个槽，代价 Θ(n)。</text>
  </g>
</svg>
