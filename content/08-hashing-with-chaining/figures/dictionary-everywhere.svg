<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 669 536" width="669" height="536"
     role="img" aria-labelledby="fig-dictionary-everywhere-title fig-dictionary-everywhere-desc">
  <title id="fig-dictionary-everywhere-title">字典出现在哪些地方</title>
  <desc id="fig-dictionary-everywhere-desc">左列 7 项是把字典直接当字典用：语言内置、文档距离、数据库、编译器、路由器、服务器、虚拟内存；右列 4 项是借哈希技术解决别的问题：子串搜索、字符串公共性、文件同步、密码学。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="669" height="536" fill="#ffffff"/>
  <text x="334.5" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">字典出现在哪些地方</text>
  <g transform="translate(22.0,77.0)">
  <rect x="0" y="0" width="300" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="150" y="22.2" font-size="12" fill="#1e40af" text-anchor="middle">语言内置：多数现代语言都有</text>
  <rect x="0" y="61" width="300" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="150" y="83.2" font-size="12" fill="#1e40af" text-anchor="middle">文档距离：词频统计与内积</text>
  <rect x="0" y="122" width="300" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="150" y="144.2" font-size="12" fill="#1e40af" text-anchor="middle">数据库：Berkeley DB</text>
  <rect x="0" y="183" width="300" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="150" y="205.2" font-size="12" fill="#1e40af" text-anchor="middle">编译器：名字 → 变量</text>
  <rect x="0" y="244" width="300" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="150" y="266.2" font-size="12" fill="#1e40af" text-anchor="middle">路由器：IP 地址 → 线路</text>
  <rect x="0" y="305" width="300" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="150" y="327.2" font-size="12" fill="#1e40af" text-anchor="middle">服务器：端口号 → socket</text>
  <rect x="0" y="366" width="300" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="150" y="388.2" font-size="12" fill="#1e40af" text-anchor="middle">虚拟内存：虚拟地址 → 物理地址</text>
  <rect x="325" y="0" width="300" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="475" y="22.2" font-size="12" fill="#b45309" text-anchor="middle">子串搜索：grep、Google [L9]</text>
  <rect x="325" y="61" width="300" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="475" y="83.2" font-size="12" fill="#b45309" text-anchor="middle">字符串公共性：DNA [PS4]</text>
  <rect x="325" y="122" width="300" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="475" y="144.2" font-size="12" fill="#b45309" text-anchor="middle">文件与目录同步：rsync</text>
  <rect x="325" y="183" width="300" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="475" y="205.2" font-size="12" fill="#b45309" text-anchor="middle">密码学：文件传输与识别 [L10]</text>
  <text x="150" y="-22" font-size="12" fill="#1f2937" text-anchor="middle">显式用字典（7 项）</text>
  <text x="475" y="-22" font-size="12" fill="#1f2937" text-anchor="middle">借哈希技术（4 项）</text>
  <text x="312.5" y="434" font-size="10" fill="#64748b" text-anchor="middle">前 7 项把字典直接当字典用；后 4 项是用哈希技术解决别的问题，第 9、10 讲还会回来。</text>
  </g>
</svg>
