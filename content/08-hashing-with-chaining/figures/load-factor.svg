<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 729 236" width="729" height="236"
     role="img" aria-labelledby="fig-load-factor-title fig-load-factor-desc">
  <title id="fig-load-factor-title">装填因子 α = n/m 与期望代价</title>
  <desc id="fig-load-factor-desc">n 是表里键的个数，m 是槽数，装填因子 α = n/m 就是每条链的期望长度；查找的期望代价是 Θ(1 + α)，只要 m = Ω(n) 就是 O(1)。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="729" height="236" fill="#ffffff"/>
  <text x="364.5" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">装填因子 α = n/m 与期望代价</text>
  <g transform="translate(22.0,46.0)">
  <rect x="0" y="0" width="330" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="165" y="22.2" font-size="12" fill="#1e40af" text-anchor="middle">n = 表里键的个数</text>
  <text x="165" y="40.2" font-size="12" fill="#1e40af" text-anchor="middle">m = 表里的槽数</text>
  <text x="165" y="58.2" font-size="12" fill="#1e40af" text-anchor="middle">α = n/m：链的期望长度</text>
  <rect x="355" y="0" width="330" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="520" y="22.2" font-size="12" fill="#b45309" text-anchor="middle">查找的期望代价 = Θ(1 + α)</text>
  <text x="520" y="40.2" font-size="12" fill="#b45309" text-anchor="middle">1 来自算哈希与随机访问</text>
  <text x="520" y="58.2" font-size="12" fill="#b45309" text-anchor="middle">α 来自在链里逐个找</text>
  <rect x="0" y="97" width="685" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="342.5" y="119.2" font-size="12" fill="#166534" text-anchor="middle">α = O(1) 当且仅当 m = Ω(n)：槽数与键数同量级，每次操作就是 O(1)</text>
  <text x="342.5" y="165" font-size="10" fill="#64748b" text-anchor="middle">只要槽数与键数是同一个量级，α = O(1)，每次操作就是常数时间。</text>
  </g>
</svg>
