<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 629 260" width="629" height="260"
     role="img" aria-labelledby="fig-hashing-universe-title fig-hashing-universe-desc">
  <title id="fig-hashing-universe-title">哈希：把整个键域压进 m 个槽</title>
  <desc id="fig-hashing-universe-desc">哈希函数 h 把整个键域 U 映射到 0 到 m − 1 这 m 个槽；m 取在真正存的 n 个键的量级上，两个不同的键落到同一个槽就叫碰撞。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="629" height="260" fill="#ffffff"/>
  <text x="314.5" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">哈希：把整个键域压进 m 个槽</text>
  <g transform="translate(22.0,46.0)">
  <rect x="0" y="0" width="300" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="150" y="22.2" font-size="12" fill="#1e40af" text-anchor="middle">键域 U：所有可能的键</text>
  <rect x="0" y="61" width="300" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="150" y="83.2" font-size="12" fill="#b45309" text-anchor="middle">哈希函数 h：U → {0, 1, …, m − 1}</text>
  <rect x="0" y="122" width="300" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="150" y="144.2" font-size="12" fill="#166534" text-anchor="middle">m 个槽：下标 0 到 m − 1</text>
  <rect x="325" y="0" width="260" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="455" y="22.2" font-size="12" fill="#1e40af" text-anchor="middle">字典里真正存的 n 个键</text>
  <rect x="325" y="61" width="260" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="455" y="83.2" font-size="12" fill="#1e40af" text-anchor="middle">m ≈ n：表的大小取在 n 的量级</text>
  <rect x="325" y="122" width="260" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="455" y="144.2" font-size="12" fill="#9d174d" text-anchor="middle">碰撞：h(ki) = h(kj)</text>
  <path d="M150,41 L150,50" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M150,102 L150,111" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M455,41 L455,50" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="312.5" y="190" font-size="10" fill="#64748b" text-anchor="middle">m 取在 n 的量级上，表就不会太大；代价是不同键可能落到同一个槽。</text>
  </g>
</svg>
