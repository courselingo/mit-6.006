<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 729 280" width="729" height="280"
     role="img" aria-labelledby="fig-grow-and-amortize-title fig-grow-and-amortize-desc">
  <title id="fig-grow-and-amortize-title">两种涨法的总代价，与摊还的账</title>
  <desc id="fig-grow-and-amortize-desc">上面是表满了以后的两种涨法：m += 1 时每次插入都要重建，n 次插入的总代价是 1 + 2 + ⋯ + n = Θ(n²)；m *= 2 时重建只发生在第 2 的 i 次方那些插入上，总代价是 1 + 2 + 4 + ⋯ + n = Θ(n)。下面是摊还的定义：k 次操作的总代价不超过 k · T(n)，就说单次操作的摊还代价是 T(n)。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="729" height="280" fill="#ffffff"/>
  <text x="364.5" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两种涨法的总代价，与摊还的账</text>
  <g transform="translate(22.0,46.0)">
  <rect x="0" y="0" width="685" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="342.5" y="22.2" font-size="12" fill="#b45309" text-anchor="middle">表满了以后怎么长：两种做法，两种总代价</text>
  <rect x="0" y="61" width="330" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="165" y="83.2" font-size="12" fill="#9d174d" text-anchor="middle">m += 1：每次插入都重建</text>
  <text x="165" y="101.2" font-size="12" fill="#9d174d" text-anchor="middle">1 + 2 + ⋯ + n = Θ(n²)</text>
  <rect x="355" y="61" width="330" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="520" y="83.2" font-size="12" fill="#166534" text-anchor="middle">m *= 2：只在第 2 的 i 次方重建</text>
  <text x="520" y="101.2" font-size="12" fill="#166534" text-anchor="middle">1 + 2 + 4 + ⋯ + n = Θ(n)</text>
  <rect x="0" y="140" width="685" height="72" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="342.5" y="171.2" font-size="12" fill="#6b21a8" text-anchor="middle">摊还：k 次操作的总代价 ≤ k · T(n)，单次操作的摊还代价就是 T(n)</text>
  <text x="342.5" y="189.2" font-size="12" fill="#6b21a8" text-anchor="middle">房租每月 1500 美元 ≈ 每天 50 美元；哈希表插入是 O(1) 摊还</text>
  <path d="M342,41 Q 165,41 165,50" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M342,41 Q 520,41 520,50" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
</svg>
