<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 685 287" width="685" height="287"
     role="img" aria-labelledby="fig-naive-matcher-title fig-naive-matcher-desc">
  <title id="fig-naive-matcher-title">朴素做法：s 对齐到 t 的每个起点</title>
  <desc id="fig-naive-matcher-desc">示意：t 是 8 个格子，s 是 3 个格子；s 往右挪一格，两个起点都要逐字符比一遍。能对齐的起点一共 |t| − |s| = 5 个，每个起点 O(|s|)，合起来是 O(|s| · |t|)。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="685" height="287" fill="#ffffff"/>
  <text x="342.5" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">朴素做法：s 对齐到 t 的每个起点</text>
  <g transform="translate(96.0,46.0)">
  <rect x="0" y="0" width="49" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="24.5" y="22.2" font-size="12" fill="#1e40af" text-anchor="middle"></text>
  <rect x="74" y="0" width="49" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="98.5" y="22.2" font-size="12" fill="#1e40af" text-anchor="middle"></text>
  <rect x="148" y="0" width="49" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="172.5" y="22.2" font-size="12" fill="#1e40af" text-anchor="middle"></text>
  <rect x="222" y="0" width="49" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="246.5" y="22.2" font-size="12" fill="#1e40af" text-anchor="middle"></text>
  <rect x="296" y="0" width="49" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="320.5" y="22.2" font-size="12" fill="#1e40af" text-anchor="middle"></text>
  <rect x="370" y="0" width="49" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="394.5" y="22.2" font-size="12" fill="#1e40af" text-anchor="middle"></text>
  <rect x="444" y="0" width="49" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="468.5" y="22.2" font-size="12" fill="#1e40af" text-anchor="middle"></text>
  <rect x="518" y="0" width="49" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="542.5" y="22.2" font-size="12" fill="#1e40af" text-anchor="middle"></text>
  <rect x="0" y="61" width="49" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="24.5" y="83.2" font-size="12" fill="#166534" text-anchor="middle"></text>
  <rect x="74" y="122" width="49" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="98.5" y="144.2" font-size="12" fill="#166534" text-anchor="middle"></text>
  <rect x="74" y="61" width="49" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="98.5" y="83.2" font-size="12" fill="#166534" text-anchor="middle"></text>
  <rect x="148" y="122" width="49" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="172.5" y="144.2" font-size="12" fill="#166534" text-anchor="middle"></text>
  <rect x="148" y="61" width="49" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="172.5" y="83.2" font-size="12" fill="#166534" text-anchor="middle"></text>
  <rect x="222" y="122" width="49" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="246.5" y="144.2" font-size="12" fill="#166534" text-anchor="middle"></text>
  <rect x="-74" y="0" width="49" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="-49.5" y="22.2" font-size="12" fill="#b45309" text-anchor="middle">t</text>
  <rect x="-74" y="61" width="49" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="-49.5" y="83.2" font-size="12" fill="#b45309" text-anchor="middle">s</text>
  <rect x="0" y="122" width="49" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="24.5" y="144.2" font-size="12" fill="#b45309" text-anchor="middle">s</text>
  <path d="M98.5,102 L98.5,111" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="138" y="111" font-size="10" fill="#64748b" text-anchor="start">往右挪一格</text>
  <rect x="0" y="183" width="567" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="283.5" y="205.2" font-size="12" fill="#6b21a8" text-anchor="middle">每个起点比 |s| = 3 个字符，一共 |t| − |s| = 5 个起点，所以是 O(|s| · |t|)</text>
  </g>
</svg>
