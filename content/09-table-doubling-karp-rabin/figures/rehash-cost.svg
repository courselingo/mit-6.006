<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 664 210" width="664" height="210"
     role="img" aria-labelledby="fig-rehash-cost-title fig-rehash-cost-desc">
  <title id="fig-rehash-cost-title">重哈希：尺寸一变，整张表要重建</title>
  <desc id="fig-rehash-cost-desc">旧表里的每个元素都要重新算一次哈希、插进新表，因为 m 与 r 一变，每个键算出来的槽位就都变了；一次重哈希的代价是 Θ(n + m)，当 m 与 n 同量级时就是 Θ(n)，而平时插入一个元素只是期望 O(1)。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="664" height="210" fill="#ffffff"/>
  <text x="332.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">重哈希：尺寸一变，整张表要重建</text>
  <g transform="translate(22.0,46.0)">
  <rect x="0" y="0" width="190" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="95" y="22.2" font-size="12" fill="#1e40af" text-anchor="middle">旧表：m 个槽</text>
  <text x="95" y="40.2" font-size="12" fill="#1e40af" text-anchor="middle">哈希函数用的是 (m, r)</text>
  <rect x="215" y="0" width="190" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="310" y="22.2" font-size="12" fill="#b45309" text-anchor="middle">改尺寸：m 与 r 都要变</text>
  <text x="310" y="40.2" font-size="12" fill="#b45309" text-anchor="middle">旧的位置全部作废</text>
  <rect x="430" y="0" width="190" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="525" y="22.2" font-size="12" fill="#166534" text-anchor="middle">新表：逐槽重算哈希</text>
  <text x="525" y="40.2" font-size="12" fill="#166534" text-anchor="middle">把元素插进去</text>
  <path d="M195,27 L204,27" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M410,27 L419,27" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="0" y="79" width="620" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="310" y="101.2" font-size="12" fill="#6b21a8" text-anchor="middle">一次重哈希的代价：Θ(n + m)，当 m = Θ(n) 时就是 Θ(n)</text>
  <text x="310" y="140" font-size="10" fill="#64748b" text-anchor="middle">平时插入一个元素是期望 O(1)，重哈希一次是 Θ(n)</text>
  </g>
</svg>
