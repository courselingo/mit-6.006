<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 611 248" width="611" height="248"
     role="img" aria-labelledby="fig-resizable-array-title fig-resizable-array-desc">
  <title id="fig-resizable-array-title">可扩容数组：8 个格子里 6 个在用</title>
  <desc id="fig-resizable-array-desc">数组一共 8 个格子，下标 0 到 7，前面 6 个格子已经用掉（list），后面 2 个格子留着（unused）；append 大多数时候只要往下一格写，跨过容量时才把旧元素搬一次家。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="611" height="248" fill="#ffffff"/>
  <text x="305.5" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">可扩容数组：8 个格子里 6 个在用</text>
  <g transform="translate(22.0,67.5)">
  <rect x="0" y="0" width="49" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="24.5" y="22.2" font-size="12" fill="#1e40af" text-anchor="middle"></text>
  <text x="24.5" y="-14" font-size="10" fill="#64748b" text-anchor="middle">0</text>
  <rect x="74" y="0" width="49" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="98.5" y="22.2" font-size="12" fill="#1e40af" text-anchor="middle"></text>
  <text x="98.5" y="-14" font-size="10" fill="#64748b" text-anchor="middle">1</text>
  <rect x="148" y="0" width="49" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="172.5" y="22.2" font-size="12" fill="#1e40af" text-anchor="middle"></text>
  <text x="172.5" y="-14" font-size="10" fill="#64748b" text-anchor="middle">2</text>
  <rect x="222" y="0" width="49" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="246.5" y="22.2" font-size="12" fill="#1e40af" text-anchor="middle"></text>
  <text x="246.5" y="-14" font-size="10" fill="#64748b" text-anchor="middle">3</text>
  <rect x="296" y="0" width="49" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="320.5" y="22.2" font-size="12" fill="#1e40af" text-anchor="middle"></text>
  <text x="320.5" y="-14" font-size="10" fill="#64748b" text-anchor="middle">4</text>
  <rect x="370" y="0" width="49" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="394.5" y="22.2" font-size="12" fill="#1e40af" text-anchor="middle"></text>
  <text x="394.5" y="-14" font-size="10" fill="#64748b" text-anchor="middle">5</text>
  <rect x="444" y="0" width="49" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="468.5" y="22.2" font-size="12" fill="#166534" text-anchor="middle"></text>
  <text x="468.5" y="-14" font-size="10" fill="#64748b" text-anchor="middle">6</text>
  <rect x="518" y="0" width="49" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="542.5" y="22.2" font-size="12" fill="#166534" text-anchor="middle"></text>
  <text x="542.5" y="-14" font-size="10" fill="#64748b" text-anchor="middle">7</text>
  <path d="M172.5,41 L172.5,50" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="0" y="61" width="567" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="283.5" y="83.2" font-size="12" fill="#1e40af" text-anchor="middle">前 6 个格子已经用掉（list），后面 2 个格子留着（unused）</text>
  <rect x="0" y="122" width="567" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="283.5" y="144.2" font-size="12" fill="#6b21a8" text-anchor="middle">append 大多数时候只要往下一格写，跨过容量时才把旧元素搬一次家</text>
  </g>
</svg>
