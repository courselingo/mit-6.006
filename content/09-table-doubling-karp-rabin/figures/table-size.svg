<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 262" width="744" height="262"
     role="img" aria-labelledby="fig-table-size-title fig-table-size-desc">
  <title id="fig-table-size-title">表太大浪费，太小变慢</title>
  <desc id="fig-table-size-desc">左列是 m 太小的后果：链变长、α 变大，查找退化成顺着链一个个走；右列是 m 太大的后果：大量槽位空着，相对于 n 就是白占内存。讲义给的思路是从常数大小开始，按需要长大或者缩小。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="744" height="262" fill="#ffffff"/>
  <text x="372.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">表太大浪费，太小变慢</text>
  <g transform="translate(22.0,46.0)">
  <rect x="0" y="0" width="700" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="350" y="22.2" font-size="12" fill="#1e40af" text-anchor="middle">希望 m = Θ(n)：表的大小与键的个数同量级</text>
  <rect x="0" y="61" width="337" height="72" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="168.5" y="83.2" font-size="12" fill="#9d174d" text-anchor="middle">m 太小</text>
  <text x="168.5" y="101.2" font-size="12" fill="#9d174d" text-anchor="middle">链变长，α 变大</text>
  <text x="168.5" y="119.2" font-size="12" fill="#9d174d" text-anchor="middle">查找退化成顺着链走</text>
  <rect x="362" y="61" width="337" height="72" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="530.5" y="83.2" font-size="12" fill="#9d174d" text-anchor="middle">m 太大</text>
  <text x="530.5" y="101.2" font-size="12" fill="#9d174d" text-anchor="middle">大量槽位空着</text>
  <text x="530.5" y="119.2" font-size="12" fill="#9d174d" text-anchor="middle">相对 n 就是白占内存</text>
  <rect x="0" y="158" width="700" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="350" y="180.2" font-size="12" fill="#166534" text-anchor="middle">思路：从常数大小开始，按需要长大或者缩小</text>
  <path d="M350,41 Q 168,41 168,50" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M350,41 Q 530,41 530,50" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
</svg>
