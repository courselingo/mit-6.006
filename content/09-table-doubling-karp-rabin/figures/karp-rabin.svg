<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 754 210" width="754" height="210"
     role="img" aria-labelledby="fig-karp-rabin-title fig-karp-rabin-desc">
  <title id="fig-karp-rabin-title">Karp-Rabin 的三步</title>
  <desc id="fig-karp-rabin-desc">第一步比哈希值，两边都是 O(1)；第二步只在哈希相等时才核对，代价 O(|s|)，而撞车的概率小于 1/|s|，所以每个起点的期望核对代价是 O(1)；第三步总的期望时间是 O(|s| + |t| · cost(h))，成败落在 cost(h) 上。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="754" height="210" fill="#ffffff"/>
  <text x="377.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">Karp-Rabin 的三步</text>
  <g transform="translate(22.0,46.0)">
  <rect x="0" y="0" width="220" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="110" y="22.2" font-size="12" fill="#1e40af" text-anchor="middle">先比哈希：h(s) 与 h(窗口)</text>
  <text x="110" y="40.2" font-size="12" fill="#1e40af" text-anchor="middle">两边都只要 O(1)</text>
  <rect x="245" y="0" width="220" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="355" y="22.2" font-size="12" fill="#9d174d" text-anchor="middle">哈希相等才核对</text>
  <text x="355" y="40.2" font-size="12" fill="#9d174d" text-anchor="middle">O(|s|)，撞车概率 &lt; 1/|s|</text>
  <rect x="490" y="0" width="220" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="600" y="22.2" font-size="12" fill="#166534" text-anchor="middle">期望摊到每个起点</text>
  <text x="600" y="40.2" font-size="12" fill="#166534" text-anchor="middle">是 O(1)</text>
  <path d="M225,27 L234,27" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M470,27 L479,27" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="0" y="79" width="710" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="355" y="101.2" font-size="12" fill="#b45309" text-anchor="middle">总期望时间 O(|s| + |t| · cost(h))；要做的就是让 cost(h) = O(1)</text>
  <text x="355" y="140" font-size="10" fill="#64748b" text-anchor="middle">相邻两个窗口只差一个字符，下一个哈希可以从上一个算出来</text>
  </g>
</svg>
