<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450"
     role="img" aria-labelledby="fig-dp20-summary-title fig-dp20-summary-desc">
  <title id="fig-dp20-summary-title">DP 的摘要：仔细的暴力、猜测加递归加记忆化、依赖无环、时间公式、摊还、DAG 最短路</title>
  <desc id="fig-dp20-summary-desc">讲义把动态规划压成几句话：它是仔细的暴力，是猜测加递归加记忆化，是把问题分成个数合理的子问题并让它们的解无环地互相依赖；总时间是每个子问题的时间乘子问题个数，本质上是一次摊还，也等价于在某个 DAG 上求最短路。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="450" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">DP 的摘要：仔细的暴力、猜测加递归加记忆化、依赖无环、时间公式、摊还、DAG 最短路</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">DP 约等于「仔细的暴力」</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="147" font-size="12" fill="#1e40af" text-anchor="middle">DP 约等于「猜测 + 递归 + 记忆化」</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="208" font-size="12" fill="#b45309" text-anchor="middle">DP 约等于「把问题分成个数合理的子问题，让它们的解无环地互相依赖」</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="269" font-size="12" fill="#166534" text-anchor="middle">总时间 = 每个子问题的时间 × 子问题个数（把递归调用当 O(1)）</text>
  <rect x="22" y="308" width="716" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="330" font-size="12" fill="#6b21a8" text-anchor="middle">本质上是一次摊还：每个子问题只算一次，之后命中表就是 Θ(1)</text>
  <rect x="22" y="369" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="391" font-size="12" fill="#166534" text-anchor="middle">DP 约等于「在某个 DAG 上求最短路」</text>
  <text x="380" y="427" font-size="10" fill="#64748b" text-anchor="middle">这六句是本讲的定盘星，后面两个例子只是在填这份模板</text>
</svg>
