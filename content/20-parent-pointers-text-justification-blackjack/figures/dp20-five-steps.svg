<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" width="760" height="389"
     role="img" aria-labelledby="fig-dp20-five-steps-title fig-dp20-five-steps-desc">
  <title id="fig-dp20-five-steps-title">五步清单：每步都带一个要数的量，最后乘起来就是总代价</title>
  <desc id="fig-dp20-five-steps-desc">动态规划的五步：定义子问题并数个数；猜解的一部分并数选择数；把子问题的解关联起来并算每子问题时间；递归加记忆化或自底向上填表，并检查依赖无环；最后说明原问题怎么由子问题得到。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="389" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">五步清单：每步都带一个要数的量，最后乘起来就是总代价</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">第 1 步：定义子问题 —— 数一数有多少个子问题</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="147" font-size="12" fill="#1e40af" text-anchor="middle">第 2 步：猜（解的一部分）—— 数一数每个子问题有几种猜法</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="208" font-size="12" fill="#b45309" text-anchor="middle">第 3 步：把子问题的解关联起来 —— 算出每个子问题要多少时间</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="269" font-size="12" fill="#b45309" text-anchor="middle">第 4 步：递归加记忆化，或自底向上填表 —— 并检查顺序合法（依赖无环）</text>
  <rect x="22" y="308" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="330" font-size="12" fill="#166534" text-anchor="middle">第 5 步：解决原问题 —— 它本身是某个子问题，或由子问题组合而来（额外时间）</text>
  <text x="380" y="366" font-size="10" fill="#64748b" text-anchor="middle">总代价 = 每子问题时间 × 子问题个数；前两步正是这两个因子</text>
</svg>
