<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 269" width="760" height="269"
     role="img" aria-labelledby="fig-dp20-parent-pointers-title fig-dp20-parent-pointers-desc">
  <title id="fig-dp20-parent-pointers-title">parent pointers：记下每个子问题用的那个猜测，再从原问题一路走回起点</title>
  <desc id="fig-dp20-parent-pointers-desc">从表里还原解的办法是存父指针：在每个子问题里记下它用的那个猜测（取最小或最大时的下标），之后从原问题一路走回去就能得到具体方案；这个改动与记忆化、自底向上一样是自动的。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="269" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">parent pointers：记下每个子问题用的那个猜测，再从原问题一路走回起点</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">要的不只是代价，还要具体方案：在每个子问题里记下它用的那个猜测</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="147" font-size="12" fill="#b45309" text-anchor="middle">通常做法：在记最小值或最大值的同时，记下取到它的那个下标</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="208" font-size="12" fill="#166534" text-anchor="middle">再从原问题一路走回去，把每一步的选择串起来，就得到方案</text>
  <text x="380" y="244" font-size="10" fill="#64748b" text-anchor="middle">这个改动与记忆化、自底向上一样是机械的，不需要重新想算法</text>
</svg>
