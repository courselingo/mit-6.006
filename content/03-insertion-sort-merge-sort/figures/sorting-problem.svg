<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 219" width="760" height="219"
     role="img" aria-labelledby="fig-sorting-problem-title fig-sorting-problem-desc">
  <title id="fig-sorting-problem-title">排序问题：输入一排数，输出按大小排好的同一个排列</title>
  <desc id="fig-sorting-problem-desc">输入数组 [7, 2, 5, 5, 9.6]，输出 [2, 5, 5, 7, 9.6]：元素一个不多一个不少，只是换了顺序。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="219" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">排序问题：输入一排数，输出按大小排好的同一个排列</text>
  <rect x="22" y="64" width="123.2" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="83.6" y="90" font-size="14" fill="#1e40af" text-anchor="middle">7</text>
  <rect x="170.2" y="64" width="123.2" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="231.79999999999998" y="90" font-size="14" fill="#1e40af" text-anchor="middle">2</text>
  <rect x="318.4" y="64" width="123.2" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="90" font-size="14" fill="#1e40af" text-anchor="middle">5</text>
  <rect x="466.59999999999997" y="64" width="123.2" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="528.1999999999999" y="90" font-size="14" fill="#1e40af" text-anchor="middle">5</text>
  <rect x="614.8" y="64" width="123.2" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="676.4" y="90" font-size="14" fill="#1e40af" text-anchor="middle">9.6</text>
  <path d="M380,111 L 380,120" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="22" y="131" width="123.2" height="42" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="83.6" y="157" font-size="14" fill="#166534" text-anchor="middle">2</text>
  <rect x="170.2" y="131" width="123.2" height="42" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="231.79999999999998" y="157" font-size="14" fill="#166534" text-anchor="middle">5</text>
  <rect x="318.4" y="131" width="123.2" height="42" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="157" font-size="14" fill="#166534" text-anchor="middle">5</text>
  <rect x="466.59999999999997" y="131" width="123.2" height="42" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="528.1999999999999" y="157" font-size="14" fill="#166534" text-anchor="middle">7</text>
  <rect x="614.8" y="131" width="123.2" height="42" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="676.4" y="157" font-size="14" fill="#166534" text-anchor="middle">9.6</text>
  <text x="380" y="195" font-size="10" fill="#64748b" text-anchor="middle">输入与输出是同一组数：两个 5 都还在，只换了顺序；能比大小就够了（9.6 是小数）</text>
</svg>
