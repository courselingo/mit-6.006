<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 237" width="760" height="237"
     role="img" aria-labelledby="fig-merge-two-sorted-title fig-merge-two-sorted-desc">
  <title id="fig-merge-two-sorted-title">合并两个已排序的数组：像拉链一样每次取较小的头</title>
  <desc id="fig-merge-two-sorted-desc">把两个各自有序的数组 A 与 B 合并：两个指针分别指向两边的头，比较后取较小的放进结果，指针前移；每个元素只被取出一次，所以合并的代价是 Θ(n)。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="237" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">合并两个已排序的数组：像拉链一样每次取较小的头</text>
  <rect x="22" y="64" width="345.5" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="194.75" y="86" font-size="12" fill="#166534" text-anchor="middle">A：2 5 7</text>
  <rect x="392.5" y="64" width="345.5" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="565.25" y="86" font-size="12" fill="#166534" text-anchor="middle">B：3 6 9</text>
  <path d="M194.75,105 L 194.75,118" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M565.25,105 L 565.25,118" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="22" y="129" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="151" font-size="12" fill="#1e40af" text-anchor="middle">结果：2 3 5 6 7 9</text>
  <text x="380" y="187" font-size="10" fill="#64748b" text-anchor="middle">各放一个指针在开头，每次比较两个头，取较小的那个放进结果</text>
  <text x="380" y="213" font-size="10" fill="#64748b" text-anchor="middle">每个元素只被取出一次 ⇒ 合并只要 Θ(n)</text>
</svg>
