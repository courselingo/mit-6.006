<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 275" width="620" height="275"
     role="img" aria-labelledby="fig-catalan-every-24-title fig-catalan-every-24-desc">
  <title id="fig-catalan-every-24-title">把 AD 乘 10 的 12 次方：每 24 位出现一个卡塔兰数</title>
  <desc id="fig-catalan-every-24-desc">上面那排是 AD 乘 10 的 12 次方之后的小数，每 24 位落下一个卡塔兰数：第 24、48、72、96、120、144、168 位上依次是 1、1、2、5、14、42、132，也就是 C_0 到 C_6。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="620" height="275" fill="#ffffff"/>
  <text x="310" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">把 AD 乘 10 的 12 次方：每 24 位出现一个卡塔兰数</text>

  <rect x="22" y="70" width="60" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="52" y="92.2" font-size="12" fill="#1e40af" text-anchor="middle">1</text>
  <text x="52" y="109.2" font-size="10" fill="#1e40af" text-anchor="middle">第 24 位</text>

  <rect x="108" y="70" width="60" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="138" y="92.2" font-size="12" fill="#1e40af" text-anchor="middle">1</text>
  <text x="138" y="109.2" font-size="10" fill="#1e40af" text-anchor="middle">第 48 位</text>

  <rect x="194" y="70" width="60" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="224" y="92.2" font-size="12" fill="#1e40af" text-anchor="middle">2</text>
  <text x="224" y="109.2" font-size="10" fill="#1e40af" text-anchor="middle">第 72 位</text>

  <rect x="280" y="70" width="60" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="310" y="92.2" font-size="12" fill="#1e40af" text-anchor="middle">5</text>
  <text x="310" y="109.2" font-size="10" fill="#1e40af" text-anchor="middle">第 96 位</text>

  <rect x="366" y="70" width="60" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="396" y="92.2" font-size="12" fill="#1e40af" text-anchor="middle">14</text>
  <text x="396" y="109.2" font-size="10" fill="#1e40af" text-anchor="middle">第 120 位</text>

  <rect x="452" y="70" width="60" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="482" y="92.2" font-size="12" fill="#1e40af" text-anchor="middle">42</text>
  <text x="482" y="109.2" font-size="10" fill="#1e40af" text-anchor="middle">第 144 位</text>

  <rect x="538" y="70" width="60" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="568" y="92.2" font-size="12" fill="#166534" text-anchor="middle">132</text>
  <text x="568" y="109.2" font-size="10" fill="#166534" text-anchor="middle">第 168 位</text>

  <path d="M52,129 L52,210" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M138,129 L138,210" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M224,129 L224,210" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M310,129 L310,210" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M396,129 L396,210" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M482,129 L482,210" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M568,129 L568,210" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M22,210 L598,210" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <text x="310" y="250" font-size="10" fill="#64748b" text-anchor="middle">AD × 10^12 的小数，每 24 位落下上面那一个数</text>
</svg>
