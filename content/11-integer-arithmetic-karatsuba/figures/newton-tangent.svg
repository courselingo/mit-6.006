<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 414 365" width="414" height="365"
     role="img" aria-labelledby="fig-newton-tangent-title fig-newton-tangent-desc">
  <title id="fig-newton-tangent-title">牛顿法的一步：切线在横轴上的落点就是下一站</title>
  <desc id="fig-newton-tangent-desc">曲线取 f(x) = x² − a，红点那一步的切线从点 (x_i, f(x_i)) 出发，与横轴相交，交点的横坐标就是下一站 x_{i+1}：拿落点当起点再画一次切线，就得到牛顿法的下一步。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="414" height="365" fill="#ffffff"/>
  <text x="207" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">牛顿法的一步：切线在横轴上的落点就是下一站</text>

  <path d="M22,210 L392,210" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M22,340 L22,46" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M112,336.4 Q199,234.4 286,78.4" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <path d="M122,325.2 C158.7,278.3 195.3,231.3 232,184.4" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M212,210 L212,226" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="142" cy="299.6" r="4.5" fill="#ef4444"/>

  <text x="298" y="58" font-size="11" fill="#1e40af">f(x) = x² − a</text>
  <text x="95" y="300" font-size="11" fill="#1e293b" text-anchor="middle">x_i</text>
  <text x="248" y="230" font-size="11" fill="#ef4444" text-anchor="middle">x_{i+1}</text>
  <text x="392" y="230" font-size="10" fill="#64748b" text-anchor="end">横轴</text>
</svg>
