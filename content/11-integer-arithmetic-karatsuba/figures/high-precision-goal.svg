<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 146" width="756" height="146"
     role="img" aria-labelledby="fig-high-precision-goal-title fig-high-precision-goal-desc">
  <title id="fig-high-precision-goal-title">把「算到 d 位」写成整数目标：左右两种写法并排</title>
  <desc id="fig-high-precision-goal-desc">左边是要求的小数写法 √2 到 d 位小数；中间那一步是两边同乘 10^d、把 2 搬进根号；右边是整数写法 ⌊10^d · √2⌋ = ⌊√(2 · 10^{2d})⌋，输入因此是一个 2d 位左右的整数。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="756" height="146" fill="#ffffff"/>
  <text x="378" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">把「算到 d 位」写成整数目标：左右两种写法并排</text>

  <rect x="22" y="70" width="210" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="127" y="92.2" font-size="12" fill="#1e40af" text-anchor="middle">√2 到 d 位小数</text>
  <text x="127" y="109.2" font-size="10" fill="#1e40af" text-anchor="middle">1.414213562373…（d 位）</text>

  <path d="M237,97 L247,97" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="258" y="70" width="210" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="363" y="92.2" font-size="12" fill="#b45309" text-anchor="middle">同乘 10^d</text>
  <text x="363" y="109.2" font-size="10" fill="#b45309" text-anchor="middle">把 2 搬进根号</text>

  <path d="M473,97 L483,97" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="494" y="70" width="240" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="614" y="92.2" font-size="12" fill="#166534" text-anchor="middle">⌊10^d · √2⌋ = ⌊√(2 · 10^{2d})⌋</text>
  <text x="614" y="109.2" font-size="10" fill="#166534" text-anchor="middle">输入是一个 2d 位左右的整数</text>
</svg>
