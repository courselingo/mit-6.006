<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 386" width="750" height="386"
     role="img" aria-labelledby="fig-karatsuba-three-title fig-karatsuba-three-desc">
  <title id="fig-karatsuba-three-title">Karatsuba 的三次乘法：z_0 与 z_2 直接算，z_1 用一次乘法减出来</title>
  <desc id="fig-karatsuba-three-desc">上面三行是三次乘法：z_0 = x_0 · y_0 与 z_2 = x_1 · y_1 直接算，z_1 = (x_0 + x_1)·(y_0 + y_1) − z_0 − z_2 用一次乘法减出中间两项；下面是拼回去的式子 z = z_2·r^n + z_1·r^(n/2) + z_0 与那组数字 672·10^4 + 2840·10^2 + 2652 = 7006652。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="750" height="386" fill="#ffffff"/>
  <text x="375" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">Karatsuba 的三次乘法：z_0 与 z_2 直接算，z_1 用一次乘法减出来</text>

  <rect x="115" y="70" width="520" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="375" y="92.2" font-size="12" fill="#b45309" text-anchor="middle">z_0 = x_0 · y_0</text>
  <text x="375" y="109.2" font-size="10" fill="#b45309" text-anchor="middle">直接算：34 × 78 = 2652</text>

  <rect x="115" y="150" width="520" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="375" y="172.2" font-size="12" fill="#b45309" text-anchor="middle">z_2 = x_1 · y_1</text>
  <text x="375" y="189.2" font-size="10" fill="#b45309" text-anchor="middle">直接算：12 × 56 = 672</text>

  <rect x="115" y="230" width="520" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="375" y="252.2" font-size="12" fill="#b45309" text-anchor="middle">z_1 = (x_0 + x_1) · (y_0 + y_1) − z_0 − z_2</text>
  <text x="375" y="269.2" font-size="10" fill="#b45309" text-anchor="middle">用一次乘法减出中间两项：46 × 134 − 2652 − 672 = 2840</text>

  <path d="M192,289 L192,299" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M558,289 L558,299" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="310" width="340" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="192" y="332.2" font-size="12" fill="#166534" text-anchor="middle">z = z_2·r^n + z_1·r^(n/2) + z_0</text>
  <text x="192" y="349.2" font-size="10" fill="#166534" text-anchor="middle">只要加法与移位，没有新的乘法</text>

  <rect x="388" y="310" width="340" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="558" y="332.2" font-size="12" fill="#1e40af" text-anchor="middle">672·10^4 + 2840·10^2 + 2652</text>
  <text x="558" y="349.2" font-size="10" fill="#1e40af" text-anchor="middle">= 7006652，与 1234 × 5678 一致</text>
</svg>
