<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" width="760" height="389"
     role="img" aria-labelledby="fig-b6-moore-history-title fig-b6-moore-history-desc">
  <title id="fig-b6-moore-history-title">处理器演进：主频一路涨到 2005 年然后停下，之后靠增加核数继续提升性能</title>
  <desc id="fig-b6-moore-history-desc">处理器演进史：8086 的 5 MHz、486 的 25 MHz、Pentium 的 66 MHz、Pentium 4 的 1.5 GHz 与约 30 级流水线、Pentium D 的 3.2 GHz（主频到此停止增长）、以及四核 Xeon 的 3 GHz；此后增加核数才是性能提升的来源。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="389" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">处理器演进：主频一路涨到 2005 年然后停下，之后靠增加核数继续提升性能</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">1981 年 8086：5 MHz（第一台 IBM PC 用的就是它）</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="147" font-size="12" fill="#1e40af" text-anchor="middle">1989 年 486：25 MHz（因一条判决不允许把数字注册成商标，改叫 i486）</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="208" font-size="12" fill="#b45309" text-anchor="middle">1993 年 Pentium：66 MHz；2000 年 Pentium 4：1.5 GHz，流水线深约 30 级</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="269" font-size="12" fill="#9d174d" text-anchor="middle">2005 年 Pentium D：3.2 GHz —— 主频涨到这里就停了</text>
  <rect x="22" y="308" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="330" font-size="12" fill="#166534" text-anchor="middle">2008 年四核 Xeon：3 GHz —— 此后「在芯片上增加核数」才是性能提升的来源</text>
  <text x="380" y="366" font-size="10" fill="#64748b" text-anchor="middle">单核变多核之后，「数据在哪块缓存里」成了新的瓶颈</text>
</svg>
