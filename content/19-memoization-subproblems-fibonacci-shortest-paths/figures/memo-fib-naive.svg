<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 269" width="760" height="269"
     role="img" aria-labelledby="fig-memo-fib-naive-title fig-memo-fib-naive-desc">
  <title id="fig-memo-fib-naive-title">朴素递归的重复：同一批子问题被反复展开，所以代价随 n 指数增长</title>
  <desc id="fig-memo-fib-naive-desc">按定义直接递归计算 Fibonacci，调用次数满足 T(n) = T(n−1) + T(n−2) + O(1) ≥ Fn ≈ φ^n ≥ 2^(n/2)，是指数时间；原因是同一个子问题被反复展开。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="269" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">朴素递归的重复：同一批子问题被反复展开，所以代价随 n 指数增长</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">照定义写递归：fib(n) 返回 fib(n − 1) + fib(n − 2)</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="147" font-size="12" fill="#9d174d" text-anchor="middle">调用次数 T(n) ≥ Fn ≈ φ^n ≥ 2^(n/2)：指数时间</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="208" font-size="12" fill="#9d174d" text-anchor="middle">原因：同一个子问题被反复展开计算</text>
  <text x="380" y="244" font-size="10" fill="#64748b" text-anchor="middle">那棵树里重复出现的节点，就是被浪费掉的工作</text>
</svg>
