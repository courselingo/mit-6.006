<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" width="760" height="328"
     role="img" aria-labelledby="fig-memo-fib-memoized-title fig-memo-fib-memoized-desc">
  <title id="fig-memo-fib-memoized-title">记忆化：同一张表把重复的子问题接住，时间等于子问题个数乘以每个子问题的时间</title>
  <desc id="fig-memo-fib-memoized-desc">记忆化在递归外面加一张表：每个 k 只在第一次调用时递归下去，之后直接返回表里的值；于是真正干活的调用只有 n 次，总时间等于子问题个数乘以每个子问题的时间，也就是 Θ(n)。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="328" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">记忆化：同一张表把重复的子问题接住，时间等于子问题个数乘以每个子问题的时间</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">加一张表：算出一个子问题就把它存进 memo</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="147" font-size="12" fill="#b45309" text-anchor="middle">每个 k 只在第一次被调用时真正递归，之后直接命中表</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="208" font-size="12" fill="#166534" text-anchor="middle">只有 n 次非记忆化调用（k = n, n − 1, …, 1）；命中的调用是 Θ(1)</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="269" font-size="12" fill="#166534" text-anchor="middle">时间 = 子问题个数 × 每个子问题的时间 = n × Θ(1) = Θ(n)</text>
  <text x="380" y="305" font-size="10" fill="#64748b" text-anchor="middle">同一份递归，只多了一张表，代价就从指数变成多项式</text>
</svg>
