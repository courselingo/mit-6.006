<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 269" width="760" height="269"
     role="img" aria-labelledby="fig-memo-shortest-cycle-title fig-memo-shortest-cycle-desc">
  <title id="fig-memo-shortest-cycle-title">最短路直接写成递归：无环图上可用 O(V+E)，有环时子问题互相依赖，递归转不出来</title>
  <desc id="fig-memo-shortest-cycle-desc">把最短路写成递归形式 δ(s,v) = min{w(u,v) + δ(s,u)} 之后：有环时子问题互相依赖，递归无法终止；在无环图上可用，代价 O(V+E)，相当于 DFS 或拓扑排序加一轮松弛。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="269" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">最短路直接写成递归：无环图上可用 O(V+E)，有环时子问题互相依赖，递归转不出来</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">递归形式：δ(s, v) = min{w(u, v) + δ(s, u)}</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="147" font-size="12" fill="#9d174d" text-anchor="middle">有环时子问题互相依赖，递归转不出来（讲义说「无限时间」）</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="208" font-size="12" fill="#166534" text-anchor="middle">无环图上可用：O(V + E)，相当于 DFS 或拓扑序加一轮 Bellman-Ford</text>
  <text x="380" y="244" font-size="10" fill="#64748b" text-anchor="middle">所以得到一条设计原则：子问题的依赖必须无环</text>
</svg>
