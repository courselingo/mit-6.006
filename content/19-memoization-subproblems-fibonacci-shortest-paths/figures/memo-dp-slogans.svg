<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" width="760" height="389"
     role="img" aria-labelledby="fig-memo-dp-slogans-title fig-memo-dp-slogans-desc">
  <title id="fig-memo-dp-slogans-title">DP 的几句口号：受控的暴力、递归加复用、递归加记忆化、递归加记忆化加猜测、DAG 最短路</title>
  <desc id="fig-memo-dp-slogans-desc">讲义给动态规划下了几句口号：它约等于受控的暴力、递归加复用、递归加记忆化、递归加记忆化加猜测，最后约等于在某个 DAG 上求最短路。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="389" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">DP 的几句口号：受控的暴力、递归加复用、递归加记忆化、递归加记忆化加猜测、DAG 最短路</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">第一条：DP 约等于「受控的暴力」——把枚举限制在有重叠的子问题上</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="147" font-size="12" fill="#1e40af" text-anchor="middle">第二条：DP 约等于「递归 + 复用」</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="208" font-size="12" fill="#b45309" text-anchor="middle">第三条：DP 约等于「递归 + 记忆化」</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="269" font-size="12" fill="#6b21a8" text-anchor="middle">第四条：DP 约等于「递归 + 记忆化 + 猜测」</text>
  <rect x="22" y="308" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="330" font-size="12" fill="#166534" text-anchor="middle">第五条：DP 约等于「某个 DAG 上的最短路」</text>
  <text x="380" y="366" font-size="10" fill="#64748b" text-anchor="middle">这五句是本讲要走的四步：每加一样东西，方法就更强一层</text>
</svg>
