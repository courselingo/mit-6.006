<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" width="760" height="328"
     role="img" aria-labelledby="fig-memo-guessing-dag-title fig-memo-guessing-dag-desc">
  <title id="fig-memo-guessing-dag-title">猜测与 DAG 视角：枚举最后一条边的可能（多项式种），把图按层复制成 DAG</title>
  <desc id="fig-memo-guessing-dag-desc">设计递推式的动作是猜测：不知道最后一条边是哪条，就枚举所有可能并取最好的那个，合法性来自最优子结构；判据是每个子问题的候选数要小。DAG 视角则把图按时间复制一份，使问题变成无环图上的最短路。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="328" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">猜测与 DAG 视角：枚举最后一条边的可能（多项式种），把图按层复制成 DAG</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">不知道答案的最后一条边是哪条 ⇒ 枚举所有可能，取最好的</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="147" font-size="12" fill="#b45309" text-anchor="middle">之所以可以猜：靠最优子结构，前面那段一定是最短路</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="208" font-size="12" fill="#9d174d" text-anchor="middle">判据：每个子问题的候选猜测数要小（多项式），它通常决定每子问题的时间</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="269" font-size="12" fill="#166534" text-anchor="middle">DAG 视角：把图按时间复制一份 ⇒ 变成无环图 ⇒ DP 就是某个 DAG 上的最短路</text>
  <text x="380" y="305" font-size="10" fill="#64748b" text-anchor="middle">到这里三个动作凑齐了：递归、记忆化、猜测</text>
</svg>
