<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 237" width="760" height="237"
     role="img" aria-labelledby="fig-heap-sort-title fig-heap-sort-desc">
  <title id="fig-heap-sort-title">堆排序的一轮：堆顶与堆尾交换，再修一次堆</title>
  <desc id="fig-heap-sort-desc">堆排序每轮把堆顶（当前最大元）与堆的末尾交换，让它落到最终位置，然后把堆的规模减一，再对新的堆顶调用一次 max_heapify；重复 n 轮就排好了，总体 O(n log n)，且是原地排序。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="237" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">堆排序的一轮：堆顶与堆尾交换，再修一次堆</text>
  <rect x="22" y="64" width="49.1" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="46.55" y="86" font-size="12" fill="#1e40af" text-anchor="middle">16</text>
  <rect x="96.1" y="64" width="49.1" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="120.64999999999999" y="86" font-size="12" fill="#1e40af" text-anchor="middle">14</text>
  <rect x="170.2" y="64" width="49.1" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194.75" y="86" font-size="12" fill="#1e40af" text-anchor="middle">10</text>
  <rect x="244.29999999999998" y="64" width="49.1" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="268.84999999999997" y="86" font-size="12" fill="#1e40af" text-anchor="middle">8</text>
  <rect x="318.4" y="64" width="49.1" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="342.95" y="86" font-size="12" fill="#1e40af" text-anchor="middle">7</text>
  <rect x="392.5" y="64" width="49.1" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="417.05" y="86" font-size="12" fill="#1e40af" text-anchor="middle">9</text>
  <rect x="466.59999999999997" y="64" width="49.1" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="491.15" y="86" font-size="12" fill="#1e40af" text-anchor="middle">3</text>
  <rect x="540.6999999999999" y="64" width="49.1" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="565.2499999999999" y="86" font-size="12" fill="#1e40af" text-anchor="middle">2</text>
  <rect x="614.8" y="64" width="49.1" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="639.3499999999999" y="86" font-size="12" fill="#1e40af" text-anchor="middle">4</text>
  <rect x="688.9" y="64" width="49.1" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="713.4499999999999" y="86" font-size="12" fill="#1e40af" text-anchor="middle">1</text>
  <path d="M342.95,105 L 342.95,118" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="22" y="129" width="49.1" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="46.55" y="151" font-size="12" fill="#1e40af" text-anchor="middle">14</text>
  <rect x="96.1" y="129" width="49.1" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="120.64999999999999" y="151" font-size="12" fill="#1e40af" text-anchor="middle">10</text>
  <rect x="170.2" y="129" width="49.1" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194.75" y="151" font-size="12" fill="#1e40af" text-anchor="middle">9</text>
  <rect x="244.29999999999998" y="129" width="49.1" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="268.84999999999997" y="151" font-size="12" fill="#1e40af" text-anchor="middle">8</text>
  <rect x="318.4" y="129" width="49.1" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="342.95" y="151" font-size="12" fill="#1e40af" text-anchor="middle">7</text>
  <rect x="392.5" y="129" width="49.1" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="417.05" y="151" font-size="12" fill="#1e40af" text-anchor="middle">4</text>
  <rect x="466.59999999999997" y="129" width="49.1" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="491.15" y="151" font-size="12" fill="#1e40af" text-anchor="middle">3</text>
  <rect x="540.6999999999999" y="129" width="49.1" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="565.2499999999999" y="151" font-size="12" fill="#1e40af" text-anchor="middle">2</text>
  <rect x="614.8" y="129" width="49.1" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="639.3499999999999" y="151" font-size="12" fill="#1e40af" text-anchor="middle">1</text>
  <rect x="688.9" y="129" width="49.1" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="713.4499999999999" y="151" font-size="12" fill="#166534" text-anchor="middle">16</text>
  <text x="380" y="187" font-size="10" fill="#64748b" text-anchor="middle">堆顶与末尾交换 ⇒ 16 落到最终位置；堆的规模减一，再对堆顶做一次 max_heapify</text>
  <text x="380" y="213" font-size="10" fill="#64748b" text-anchor="middle">每轮 O(log n)，共 n 轮 ⇒ 总体 O(n log n)；整个过程是原地的</text>
</svg>
