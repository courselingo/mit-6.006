<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" width="760" height="328"
     role="img" aria-labelledby="fig-bf-correctness-title fig-bf-correctness-desc">
  <title id="fig-bf-correctness-title">为什么 |V|−1 轮够：第 i 轮能让最短路径上的第 i 个顶点定稿，而这条路径最多有 |V|−1 条边</title>
  <desc id="fig-bf-correctness-desc">证明取一条边数最少的最短路径 p = ⟨v0,…,vk⟩：无负环使它不重复顶点，所以 k ≤ |V|−1；第一轮的松弛会定下 v1，第二轮定下 v2，依此类推第 k 轮定下 v；于是 |V|−1 轮足够。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="328" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">为什么 |V|−1 轮够：第 i 轮能让最短路径上的第 i 个顶点定稿，而这条路径最多有 |V|−1 条边</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">取一条从 s 到 v 的最短路径，并在其中挑边数最少的那条：p = ⟨v0, …, vk⟩</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="147" font-size="12" fill="#1e40af" text-anchor="middle">没有负环 ⇒ 这条路径不重复顶点 ⇒ k ≤ |V| − 1</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="208" font-size="12" fill="#b45309" text-anchor="middle">第 1 轮定下 v1，第 2 轮定下 v2，依次推进，第 k 轮定下 vk = v</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="269" font-size="12" fill="#166534" text-anchor="middle">而 k 最多是 |V| − 1 ⇒ 做满 |V| − 1 轮就足够</text>
  <text x="380" y="305" font-size="10" fill="#64748b" text-anchor="middle">这一步用到了第 16 讲的最优子结构与安全引理（同一套地基）</text>
</svg>
