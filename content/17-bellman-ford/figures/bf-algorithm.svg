<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" width="760" height="328"
     role="img" aria-labelledby="fig-bf-algorithm-title fig-bf-algorithm-desc">
  <title id="fig-bf-algorithm-title">Bellman-Ford 的三段：初始化、把每条边松弛 |V|−1 轮、最后再扫一遍以报出负环</title>
  <desc id="fig-bf-algorithm-desc">Bellman-Ford 分三段：先初始化；再把每条边松弛一遍，这样的整轮做 |V|−1 轮；最后再遍历一次所有边，只要还有边能被松弛就报告存在负权环；没有负环时结束即得 δ(s,v)。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="328" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">Bellman-Ford 的三段：初始化、把每条边松弛 |V|−1 轮、最后再扫一遍以报出负环</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">初始化：d[v] ← ∞，d[s] ← 0，Π[v] ← NIL</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="147" font-size="12" fill="#b45309" text-anchor="middle">for i = 1 to |V| − 1：把每条边松弛一遍</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="208" font-size="12" fill="#9d174d" text-anchor="middle">for each edge：若还能松弛，就报告存在负权环</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="269" font-size="12" fill="#166534" text-anchor="middle">没有负环时，结束时 d[v] = δ(s, v)</text>
  <text x="380" y="305" font-size="10" fill="#64748b" text-anchor="middle">第三段与前两段是分开的：前两段算距离，第三段只判断有没有负环</text>
</svg>
