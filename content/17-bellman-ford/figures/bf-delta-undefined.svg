<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 269" width="760" height="269"
     role="img" aria-labelledby="fig-bf-delta-undefined-title fig-bf-delta-undefined-desc">
  <title id="fig-bf-delta-undefined-title">距离的三种结果：能走到是一个数，走不到是无穷大，路径上有负环则没有定义</title>
  <desc id="fig-bf-delta-undefined-desc">讲义把 δ(u,v) 分成三种情形：v 从 u 可达时取所有路径的最小权重；不可达时记作无穷大；若从 u 到 v 的某条路径上存在负环，则 δ(u,v) 没有定义。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="269" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">距离的三种结果：能走到是一个数，走不到是无穷大，路径上有负环则没有定义</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">能走到 v：δ(u, v) 是一个数，取所有路径里最小的那个</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="147" font-size="12" fill="#1e40af" text-anchor="middle">走不到 v：δ(u, v) 记作无穷大</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="208" font-size="12" fill="#9d174d" text-anchor="middle">从 u 到 v 的某条路径上有负环：δ(u, v) 没有定义</text>
  <text x="380" y="244" font-size="10" fill="#64748b" text-anchor="middle">没有定义与无穷大不是一回事：前者连数都不是，后者是一个很大的数</text>
</svg>
