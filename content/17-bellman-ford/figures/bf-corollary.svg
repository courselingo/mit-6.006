<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 269" width="760" height="269"
     role="img" aria-labelledby="fig-bf-corollary-title fig-bf-corollary-desc">
  <title id="fig-bf-corollary-title">推论：|V|−1 轮之后还能松弛，说明当前路径重复经过了顶点，那个环一定是负环</title>
  <desc id="fig-bf-corollary-desc">推论说的是：若某个 d[v] 在 |V|−1 轮之后仍未收敛，则存在从 s 可达的负权环。证明是：还能松弛说明当前路径不简单、有顶点重复，而这条带环路径比任何简单路径都轻，所以那个环必然是负权环。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="269" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">推论：|V|−1 轮之后还能松弛，说明当前路径重复经过了顶点，那个环一定是负环</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">|V| − 1 轮之后，还能找到一条可以松弛的边</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="147" font-size="12" fill="#b45309" text-anchor="middle">⇒ 说明当前那条「最短路」重复经过了顶点，不是简单路径</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="208" font-size="12" fill="#9d174d" text-anchor="middle">⇒ 这条带环的路径比任何简单路径都轻，那个环只能是负环</text>
  <text x="380" y="244" font-size="10" fill="#64748b" text-anchor="middle">这正是收尾扫描那一段的意义：把「算不出答案」变成一个可报告的结论</text>
</svg>
