<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 269" width="760" height="269"
     role="img" aria-labelledby="fig-bf-nontermination-title fig-bf-nontermination-desc">
  <title id="fig-bf-nontermination-title">有负环时通用骨架不会终止：每一轮都还能松弛某条边，距离一路往下掉</title>
  <desc id="fig-bf-nontermination-desc">通用骨架在主循环的结束条件上什么都没保证：有负环时每轮都还能松弛，算法不会终止；而没有负环时若边挑得不好，过程也可能要指数时间。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="269" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">有负环时通用骨架不会终止：每一轮都还能松弛某条边，距离一路往下掉</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="86" font-size="12" fill="#9d174d" text-anchor="middle">有负环时，每一轮都还能松弛某条边，距离一路往下掉</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="147" font-size="12" fill="#9d174d" text-anchor="middle">于是骨架的主循环根本不会终止：不是跑得慢，而是没有终点</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="208" font-size="12" fill="#b45309" text-anchor="middle">而即使没有负环，边挑得不好也可能是指数时间</text>
  <text x="380" y="244" font-size="10" fill="#64748b" text-anchor="middle">两个坏消息的根源是同一个：骨架没有规定「挑到什么时候停」</text>
</svg>
