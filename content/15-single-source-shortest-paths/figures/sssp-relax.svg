<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" width="760" height="328"
     role="img" aria-labelledby="fig-sssp-relax-title fig-sssp-relax-desc">
  <title id="fig-sssp-relax-title">通用骨架：初始化后反复松弛，直到没有任何一条边还能被松弛</title>
  <desc id="fig-sssp-relax-desc">所有最短路算法的共同骨架：初始化把源点设为 0、其余设为无穷大；主循环反复挑一条边，若 d[v] &gt; d[u] + w(u,v) 就更新 d[v] 并把前驱记成 u；直到所有边都不能再松弛为止。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="328" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">通用骨架：初始化后反复松弛，直到没有任何一条边还能被松弛</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">初始化：d[v] ← ∞，Π[v] ← NIL，d[S] ← 0</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="147" font-size="12" fill="#1e40af" text-anchor="middle">反复做：挑一条边 (u, v)，怎么挑先不说</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="208" font-size="12" fill="#b45309" text-anchor="middle">若 d[v] &gt; d[u] + w(u, v)：d[v] ← d[u] + w(u, v)，π[v] ← u</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="269" font-size="12" fill="#166534" text-anchor="middle">直到所有边都满足 d[v] ≤ d[u] + w(u, v)（没有边可松弛）</text>
  <text x="380" y="305" font-size="10" fill="#64748b" text-anchor="middle">这个骨架里空着的位置就是「挑边顺序」，也是后面两个算法的唯一区别</text>
</svg>
