<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 269" width="760" height="269"
     role="img" aria-labelledby="fig-sssp-exponential-title fig-sssp-exponential-desc">
  <title id="fig-sssp-exponential-title">病态选边导致指数时间：每次松弛只把 d 降 1，而缺口是指数大的</title>
  <desc id="fig-sssp-exponential-desc">讲义举的坏例子：图按层排、出边权重为 4、2、1 递减，若按病态顺序挑边，每次松弛只能把 d(vn−1) 减少 1，而缺口是指数大的，总时间为 O(2^(n/2))，对应的递推是 T(0) = 0、T(n+2) = 3 + 2T(n)。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="269" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">病态选边导致指数时间：每次松弛只把 d 降 1，而缺口是指数大的</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">图按层排：v0、v1 的出边权 4，v2、v3 是 2，v4、v5 是 1</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="147" font-size="12" fill="#9d174d" text-anchor="middle">病态选边：每次只能把 d(vn−1) 减少 1，而缺口是指数大的</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="208" font-size="12" fill="#9d174d" text-anchor="middle">T(0) = 0，T(n+2) = 3 + 2T(n) ⇒ T(n) = θ(2^(n/2))</text>
  <text x="380" y="244" font-size="10" fill="#64748b" text-anchor="middle">同一骨架、同一张图，只因为挑边顺序不同，代价就从多项式掉到指数</text>
</svg>
