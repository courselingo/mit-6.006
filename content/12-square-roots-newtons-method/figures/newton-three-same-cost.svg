<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 295" width="750" height="295"
     role="img" aria-labelledby="fig-newton-three-same-cost-title fig-newton-three-same-cost-desc">
  <title id="fig-newton-three-same-cost-title">收束：三个运算最后落在同一档</title>
  <desc id="fig-newton-three-same-cost-desc">把整讲串起来是一条链。乘法那一侧已经解决；除法靠「先算倒数」把它换成了乘法，而复杂度分析说明它和乘法同阶；开方靠牛顿法把它换成了除法，而它的精度是从小长上来，所以也和乘法同阶。三个运算最后是同一档复杂度。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="750" height="295" fill="#ffffff"/>
  <text x="375.0" y="32" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">收束：三个运算最后落在同一档</text>
  <rect x="25" y="60" width="700" height="42.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="375.0" y="85.9" font-size="14" fill="#166534" text-anchor="middle">乘法 → 除法 → 开方，最后是同一档</text>
  <rect x="25" y="130.0" width="214" height="58.5" rx="6" fill="#ffffff" stroke="#64748b"/>
  <text x="132.0" y="154.1" font-size="13" fill="#1e293b" text-anchor="middle">乘法</text>
  <text x="132.0" y="173.6" font-size="12" fill="#1e293b" text-anchor="middle">Karatsuba 那一侧已经解决</text>
  <rect x="267" y="130.0" width="214" height="58.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="374.0" y="154.1" font-size="13" fill="#1e40af" text-anchor="middle">除法</text>
  <text x="374.0" y="173.6" font-size="12" fill="#1e40af" text-anchor="middle">先算倒数 ⇒ 同阶</text>
  <rect x="509" y="130.0" width="214" height="58.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="616.0" y="154.1" font-size="13" fill="#166534" text-anchor="middle">开方</text>
  <text x="616.0" y="173.6" font-size="12" fill="#166534" text-anchor="middle">牛顿法 + 精度渐长 ⇒ 同阶</text>
  <rect x="25" y="216.5" width="700" height="54.0" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="375.0" y="238.7" font-size="12" fill="#b45309" text-anchor="middle">让后两者不掉档的那一招是同一个：不要让精度从头到尾都是 d 位</text>
  <text x="375.0" y="256.7" font-size="12" fill="#b45309" text-anchor="middle">而这一讲也是这门课第一次把「近似与收敛」带进来</text>
</svg>
