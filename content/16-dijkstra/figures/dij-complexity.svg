<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" width="760" height="328"
     role="img" aria-labelledby="fig-dij-complexity-title fig-dij-complexity-desc">
  <title id="fig-dij-complexity-title">三种实现的代价对比：数组 Θ(V²)、二叉堆 Θ(V lg V + E lg V)、斐波那契堆 Θ(V lg V + E)</title>
  <desc id="fig-dij-complexity-desc">Dijkstra 的操作次数固定：入队 Θ(V)、取最小 Θ(V)、降键 Θ(E)。代入三种实现：数组取最小 Θ(V)、降键 Θ(1)，总代价 Θ(V²)；二叉最小堆两者都是 Θ(lg V)，总代价 Θ(V lg V + E lg V)；斐波那契堆取最小 Θ(lg V)、降键摊还 Θ(1)，总代价 Θ(V lg V + E)。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="328" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三种实现的代价对比：数组 Θ(V²)、二叉堆 Θ(V lg V + E lg V)、斐波那契堆 Θ(V lg V + E)</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">操作次数：入队 Θ(V) 次、取最小 Θ(V) 次、降键 Θ(E) 次</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="147" font-size="12" fill="#9d174d" text-anchor="middle">数组实现：取最小 Θ(V)、降键 Θ(1) ⇒ Θ(V² + E) = Θ(V²)</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="208" font-size="12" fill="#b45309" text-anchor="middle">二叉最小堆：两者都是 Θ(lg V) ⇒ Θ(V lg V + E lg V)</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="269" font-size="12" fill="#166534" text-anchor="middle">斐波那契堆（本课不覆盖）：取最小 Θ(lg V)、降键摊还 Θ(1) ⇒ Θ(V lg V + E)</text>
  <text x="380" y="305" font-size="10" fill="#64748b" text-anchor="middle">三代实现改进的始终是同一个位置：承载取最小与降键的那个容器</text>
</svg>
