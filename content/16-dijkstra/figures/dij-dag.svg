<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 269" width="760" height="269"
     role="img" aria-labelledby="fig-dij-dag-title fig-dij-dag-desc">
  <title id="fig-dij-dag-title">DAG 上的最短路：拓扑排序之后按顺序扫一趟，每条出边松弛一次，总代价 Θ(V + E)</title>
  <desc id="fig-dij-dag-desc">有向无环图上的最短路只要两步：先拓扑排序，再按这个顺序扫一遍，松弛每个顶点的出边；因为没有环，也就没有负环的麻烦，总代价是 Θ(V + E)。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="269" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">DAG 上的最短路：拓扑排序之后按顺序扫一趟，每条出边松弛一次，总代价 Θ(V + E)</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">第一步：给 DAG 做拓扑排序，有路径 u 到 v 就保证 u 排在 v 前面</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="147" font-size="12" fill="#1e40af" text-anchor="middle">第二步：按拓扑序扫一遍，松弛每个顶点的所有出边</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="208" font-size="12" fill="#166534" text-anchor="middle">代价 Θ(V + E)：每个顶点处理一次，每条边松弛一次</text>
  <text x="380" y="244" font-size="10" fill="#64748b" text-anchor="middle">源点左边的顶点按定义都到不了，所以那一列距离保持无穷大</text>
</svg>
