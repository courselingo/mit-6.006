<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 269" width="760" height="269"
     role="img" aria-labelledby="fig-dij-relax-safe-title fig-dij-relax-safe-desc">
  <title id="fig-dij-relax-safe-title">松弛为什么是安全的：由 d[u] ≥ δ(s,u) 与三角不等式推出 d[u]+w(u,v) ≥ δ(s,v)</title>
  <desc id="fig-dij-relax-safe-desc">引理说松弛保持不变量 d[v] ≥ δ(s,v)。证明用归纳：先把 d[u] ≥ δ(s,u) 当作前提，再由三角不等式 δ(s,v) ≤ δ(s,u) + δ(u,v) 与 w(u,v) ≥ δ(u,v)，得到 δ(s,v) ≤ d[u] + w(u,v)，所以把 d[v] 更新成 d[u] + w(u,v) 不会低于真值。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="269" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">松弛为什么是安全的：由 d[u] ≥ δ(s,u) 与三角不等式推出 d[u]+w(u,v) ≥ δ(s,v)</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">归纳前提：在这一步之前，已经有 d[u] ≥ δ(s, u)</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="147" font-size="12" fill="#b45309" text-anchor="middle">三角不等式：δ(s, v) ≤ δ(s, u) + δ(u, v)，而这条边本身给出 w(u, v) ≥ δ(u, v)</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="208" font-size="12" fill="#166534" text-anchor="middle">两头一夹：δ(s, v) ≤ d[u] + w(u, v) ⇒ 更新之后的 d[v] 仍不低于真值</text>
  <text x="380" y="244" font-size="10" fill="#64748b" text-anchor="middle">所以松弛只会把距离往真值方向推，多松弛几次不会出错</text>
</svg>
