<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" width="760" height="389"
     role="img" aria-labelledby="fig-cc23-three-classes-title fig-cc23-three-classes-desc">
  <title id="fig-cc23-three-classes-title">三个复杂度类：P 真包含于 EXP 真包含于 R，三者之外是不可计算的问题</title>
  <desc id="fig-cc23-three-classes-desc">计算复杂度分三层：P 是多项式时间可解的问题，EXP 是指数时间可解的问题，R 是只要有限时间可解即可；P 真包含于 EXP 真包含于 R，而三者之外是不可计算的问题。例子：负权环检测属于 P，n×n 棋属于 EXP 但不属于 P，俄罗斯方块属于 EXP 而是否属于 P 未知。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="389" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三个复杂度类：P 真包含于 EXP 真包含于 R，三者之外是不可计算的问题</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="86" font-size="12" fill="#166534" text-anchor="middle">P：多项式时间（n^c）能解的问题 —— 这门课一直在做的就是这个类</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="147" font-size="12" fill="#b45309" text-anchor="middle">EXP：指数时间（2^{n^c}）能解的问题 —— 比 P 宽一档</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="208" font-size="12" fill="#1e40af" text-anchor="middle">R：只要能在有限时间内解出来即可（也叫递归可解）</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="269" font-size="12" fill="#9d174d" text-anchor="middle">三者之外：不可计算（不可判定）的问题 —— 例如停机问题</text>
  <rect x="22" y="308" width="716" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="330" font-size="12" fill="#6b21a8" text-anchor="middle">例子：负权环检测属于 P；n×n 棋属于 EXP 但不属于 P；俄罗斯方块属于 EXP，是否属于 P 未知</text>
  <text x="380" y="366" font-size="10" fill="#64748b" text-anchor="middle">先看清一个问题在哪一档，再问这一档与下一档之间有没有空隙</text>
</svg>
