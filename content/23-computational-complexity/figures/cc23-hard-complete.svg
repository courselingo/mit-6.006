<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" width="760" height="389"
     role="img" aria-labelledby="fig-cc23-hard-complete-title fig-cc23-hard-complete-desc">
  <title id="fig-cc23-hard-complete-title">难与完全：NP-hard 与 EXP-hard 是两层最难，俄罗斯方块与棋分别贴在 NP 完全与 EXP 完全上</title>
  <desc id="fig-cc23-hard-complete-desc">难与完全是两个层次：NP-hard 指与 NP 里每个问题一样难（不要求自己属于 NP），NP-complete 则是它与 NP 的交集；俄罗斯方块是 NP 完全的，棋是 EXP 完全的，而 EXP-hard 指与 EXP 里每个问题一样难。NP 与 EXP 是否相等同样是开放问题。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="389" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">难与完全：NP-hard 与 EXP-hard 是两层最难，俄罗斯方块与棋分别贴在 NP 完全与 EXP 完全上</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">NP-hard：和 NP 里每个问题一样难（它本身不要求属于 NP）</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="147" font-size="12" fill="#166534" text-anchor="middle">NP-complete：既属于 NP、又是 NP-hard 的交集</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="208" font-size="12" fill="#9d174d" text-anchor="middle">俄罗斯方块是 NP 完全的：若 P 不等于 NP，它就在 NP 里但不在 P 里</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="269" font-size="12" fill="#b45309" text-anchor="middle">往上挪一层：EXP-hard 与 EXP 里每个问题一样难；棋是 EXP 完全的</text>
  <rect x="22" y="308" width="716" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="330" font-size="12" fill="#6b21a8" text-anchor="middle">注记：NP 与 EXP 是否相等也是开放问题，只是没那么有名、也没那么重要</text>
  <text x="380" y="366" font-size="10" fill="#64748b" text-anchor="middle">难是一条下界，完全是下界加上「自己属于那个类」</text>
</svg>
