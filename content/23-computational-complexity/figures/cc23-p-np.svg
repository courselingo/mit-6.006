<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 269" width="760" height="269"
     role="img" aria-labelledby="fig-cc23-p-np-title fig-cc23-p-np-desc">
  <title id="fig-cc23-p-np-title">P 与 NP 的关系：若 P = NP，那么所有能被快速检验的问题也都能被快速解决</title>
  <desc id="fig-cc23-p-np-desc">P 与 NP 是否相等是这一讲最有名的开放问题，讲义把它标成价值一百万美元的猜想；它的口语解释是「运气无法人为制造」与「生成一份解的证明可能比检验它更难」。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="269" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">P 与 NP 的关系：若 P = NP，那么所有能被快速检验的问题也都能被快速解决</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">把 NP 放进那张分层图之后就有了最有名的问题：NP 与 P 是否相等</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="147" font-size="12" fill="#9d174d" text-anchor="middle">讲义把它标成猜想，并注明价值一百万美元</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="208" font-size="12" fill="#6b21a8" text-anchor="middle">两句口语解释：运气无法人为制造；生成解的证明可能比检验它更难</text>
  <text x="380" y="244" font-size="10" fill="#64748b" text-anchor="middle">一旦 P 与 NP 相等，前面那些「猜」就都能变成真正的算法</text>
</svg>
