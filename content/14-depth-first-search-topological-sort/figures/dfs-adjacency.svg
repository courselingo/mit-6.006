<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 269" width="760" height="269"
     role="img" aria-labelledby="fig-dfs-adjacency-title fig-dfs-adjacency-desc">
  <title id="fig-dfs-adjacency-title">邻接表：长度为顶点数的数组，每一项挂着该顶点的邻居链表</title>
  <desc id="fig-dfs-adjacency-desc">图的存储是一份邻接表：一个长度为顶点数的数组，每一项挂一条链表；Adj[u] 里放的是 u 的邻居，如果是有向图则只放出去的边。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="269" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">邻接表：长度为顶点数的数组，每一项挂着该顶点的邻居链表</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">Adj：长度为 |V| 的数组，每一项挂一条链表</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="147" font-size="12" fill="#1e40af" text-anchor="middle">Adj[u] 里放的是 u 的邻居：{v ∈ V | (u, v) ∈ E}</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="208" font-size="12" fill="#b45309" text-anchor="middle">有向图里只放出去的边，进来的边不在 Adj[u] 里</text>
  <text x="380" y="244" font-size="10" fill="#64748b" text-anchor="middle">这份存储决定后面所有代价：把每条链表走一遍，就是 O(V + E)</text>
</svg>
