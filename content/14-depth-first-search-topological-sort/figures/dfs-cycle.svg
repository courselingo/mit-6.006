<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 269" width="760" height="269"
     role="img" aria-labelledby="fig-dfs-cycle-title fig-dfs-cycle-desc">
  <title id="fig-dfs-cycle-title">环检测：图有环与 DFS 见到回边互为充要条件</title>
  <desc id="fig-dfs-cycle-desc">两个方向各自成立：有回边就有环，因为回边和祖先到它的树边路径合成一个环；有环就有回边，因为沿环一步步推下去，v_k 会在 v_0 结束之前被访问，于是 (v_k, v_0) 被看成回边。合起来就是：图有环等价于 DFS 见到回边。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="269" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">环检测：图有环与 DFS 见到回边互为充要条件</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="86" font-size="12" fill="#9d174d" text-anchor="middle">有回边 ⇒ 有环：回边加上祖先到它的树边路径，正好合成一个环</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="147" font-size="12" fill="#9d174d" text-anchor="middle">有环 ⇒ 有回边：沿环推下去，v_k 一定在 v_0 结束之前被访问</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="208" font-size="12" fill="#166534" text-anchor="middle">于是：图有环，等价于 DFS 见到回边</text>
  <text x="380" y="244" font-size="10" fill="#64748b" text-anchor="middle">用处：把「找环」换成「看这条边指向的顶点在不在栈上」，不必枚举环</text>
</svg>
