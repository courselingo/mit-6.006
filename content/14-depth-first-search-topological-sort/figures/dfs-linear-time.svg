<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 227" width="760" height="227"
     role="img" aria-labelledby="fig-dfs-linear-time-title fig-dfs-linear-time-desc">
  <title id="fig-dfs-linear-time-title">DFS 的代价：内层 O(E) 加外层 O(V)，合起来 O(V + E)</title>
  <desc id="fig-dfs-linear-time-desc">DFS 的代价由两部分相加：内层遍历所有邻接表，总量是 O(E)，因为每个顶点只被调用一次；外层对所有顶点过一次，是 O(V)。合起来是 O(V + E)，也就是线性时间。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="227" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">DFS 的代价：内层 O(E) 加外层 O(V)，合起来 O(V + E)</text>
  <rect x="22" y="64" width="345.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194.75" y="84" font-size="11" fill="#1e40af" text-anchor="middle">内层：Σ|Adj[s]| = O(E)</text>
  <text x="194.75" y="101" font-size="11" fill="#1e40af" text-anchor="middle">每个顶点只被调用一次</text>
  <rect x="392.5" y="64" width="345.5" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="565.25" y="84" font-size="11" fill="#b45309" text-anchor="middle">外层：O(V)</text>
  <text x="565.25" y="101" font-size="11" fill="#b45309" text-anchor="middle">对所有顶点过一次</text>
  <path d="M194.75,119 L 194.75,132" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M565.25,119 L 565.25,132" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="22" y="143" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="165" font-size="12" fill="#166534" text-anchor="middle">O(V + E)：线性时间</text>
  <text x="380" y="201" font-size="10" fill="#64748b" text-anchor="middle">是相加不是相乘：内层数的是边，外层数的是顶点</text>
</svg>
