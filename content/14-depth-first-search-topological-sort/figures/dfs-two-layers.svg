<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 161" width="760" height="161"
     role="img" aria-labelledby="fig-dfs-two-layers-title fig-dfs-two-layers-desc">
  <title id="fig-dfs-two-layers-title">DFS 的两层结构：内层从起点递归深入，外层让每个顶点都被覆盖到</title>
  <desc id="fig-dfs-two-layers-desc">DFS 分两层：内层 DFS-visit 从起点递归深入，只看到起点能到达的部分；外层 DFS 把所有顶点过一遍，没访问过的当作新起点，从而覆盖整张图。判重的依据是 parent 里有没有这个顶点。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="161" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">DFS 的两层结构：内层从起点递归深入，外层让每个顶点都被覆盖到</text>
  <rect x="22" y="64" width="345.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194.75" y="84" font-size="11" fill="#1e40af" text-anchor="middle">内层 DFS-visit</text>
  <text x="194.75" y="101" font-size="11" fill="#1e40af" text-anchor="middle">从起点递归深入，只看 s 能到的部分</text>
  <rect x="392.5" y="64" width="345.5" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="565.25" y="84" font-size="11" fill="#b45309" text-anchor="middle">外层 DFS</text>
  <text x="565.25" y="101" font-size="11" fill="#b45309" text-anchor="middle">把所有顶点过一遍，覆盖整张图</text>
  <text x="380" y="136" font-size="10" fill="#64748b" text-anchor="middle">判重用 parent：v not in parent 既表示没访问过，也顺手记下发现关系</text>
</svg>
