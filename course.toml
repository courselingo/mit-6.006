# 按材料类型逐项核实。「笔记已授权」不等于「视频也已授权」。
# 一旦存在本表，授权闸门就只认它，不再看上面的 verified（见 docs/pipeline-spec.md §2）。
[license.materials]
notes = true                      # 讲义：讲义页带 CC BY-NC-SA 4.0，已逐字取证
slides = false                    # 幻灯片 PDF 本体未逐个打开核实 —— 保守记为未核实
video = false                     # 视频叠加平台条款（archive.org / YouTube），且本项目不做字幕翻译
textbook = false                  # 指定教材 CLRS 是商业出版物（Pearson），与 OCW 许可无关
other = false

[output]
default_mode = "explanation"

# ── 站点（GitHub Pages）──────────────────────────────────────────────
# build_site.py 用这两项生成 MkDocs 的 repo_url / site_url。
[site]
repo = "courselingo/mit-6.006"
url = "https://courselingo.github.io/mit-6.006/"

# ── 本课程的点名对象（audit_content.py 的 [audit]，见该脚本第 57–88 行）──────
# 通用脚本的默认名单偏分布式系统，算法课合法出现不了几个；这里补上本课程真正的
# 具体对象：教材、实现语言与库、课程自身的 motivating problems、经典算法名。
[audit]
named_systems = [
    "CLRS", "Python", "NumPy", "SciPy", "bisect",
    "RSA", "genome comparison", "event simulation", "image compression",
    "rubiks cube", "Dijkstra", "Bellman-Ford", "BFS", "DFS",
    "Quicksort", "Merge Sort", "Kruskal", "Karatsuba",
]
named_systems_min = 5
