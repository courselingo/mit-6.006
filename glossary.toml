notes = "课程第二个模块的引子问题；按时间顺序处理事件"

[[term]]
en = "genome comparison"
zh = "基因组比对"
notes = "课程第三个模块的引子问题；典型任务是找两段长序列的公共子串"

[[term]]
en = "image compression"
zh = "图像压缩"
notes = "课程第七个模块的引子问题；用动态规划做有损压缩"

[[term]]
en = "Rubik's cube"
key = "rubiks-cube"
zh = "魔方"
