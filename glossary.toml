zh = "多项式时间"

[[term]]
en = "reduction"
zh = "归约"
notes = "把问题 A 转换成问题 B，从而用 B 的算法或难度结论说明 A"

[[term]]
en = "NP-complete"
zh = "NP 完全"
notes = "NP 中最难的一类；目前没有已知的多项式时间算法"

# ── 第 2 讲（计算模型与文档距离）新增 ──────────────────────────────────────

[[term]]
en = "model of computation"
zh = "计算模型"
notes = "规定算法允许做哪些操作、每个操作花多少代价；算法代价 = 用到的操作代价之和"

[[term]]
en = "random access machine"
zh = "随机存取机"
notes = "RAM：内存视为大数组，常数个寄存器；装载／运算／存回三条操作各 Θ(1)"

[[term]]
en = "pointer machine"
zh = "指针机"
notes = "只有动态对象与引用，字段为字或指针；比 RAM 弱，可在 RAM 上实现"

[[term]]
en = "machine word"
zh = "机器字"
notes = "内存的一格；位数 w ≥ lg(内存大小)，约定基本对象能放进一个字"

[[term]]
en = "document distance"
zh = "文档距离"
notes = "把两篇文档的相似度写成两个词向量之间的夹角，0 度全同、90 度无共同词"

[[term]]
en = "document vector"
zh = "文档向量"
notes = "每维是一个出现过的词，坐标是该词在文档里的出现次数"

[[term]]
en = "dot product"
zh = "点积"
notes = "两向量对应分量相乘再求和；除以两个向量的长度后得到归一化点积"

[[term]]
en = "scale invariant"
zh = "尺度无关"
notes = "文档长度变化时相似度不该被长度带偏；点积不满足，需按词数归一化"

[[term]]
en = "dictionary"
zh = "字典"
notes = "键到值的映射；查找与插入在期望意义下 Θ(1)，最坏情况会退化（哈希冲突）"

# ── 第 3 讲（插入排序与归并排序）新增 ──────────────────────────────────────

[[term]]
en = "permutation"
zh = "排列"
notes = "输入数组中的元素重新排一次；排序的输出就是输入的一个排列"

[[term]]
en = "outlier"
zh = "离群值"
notes = "明显偏离其余数据的观测值；排好序之后，它落在两端，一眼能看出来"

[[term]]
en = "merge"
zh = "合并"
notes = "把两个已经各自有序的序列并成一个有序序列；归并排序的关键子程序 MERGE"

# ── 第 4 讲（堆与堆排序）新增 ──────────────────────────────────────────────

[[term]]
en = "heap property"
zh = "堆性质"
notes = "每个节点的 key 不小于（最大堆）或不大于（最小堆）其孩子的 key"

# ── 第 5 讲（调度问题与二叉搜索树）新增 ────────────────────────────────────

[[term]]
en = "height"
zh = "高度"
notes = "树里最长的一条从根到叶的路径长度；BST 的所有操作都是 O(h)"

[[term]]
en = "rank"
zh = "秩"
notes = "统计不超过某个值的元素有多少个；在 BST 上用子树规模增强后可在 O(h) 内求出"

[[term]]
en = "subtree size"
zh = "子树规模"
notes = "某节点左子树里的节点个数；增强 BST 时在插入与删除中顺手维护"

# ── 第 6 讲（平衡二叉搜索树与 AVL）新增 ────────────────────────────────────

[[term]]
en = "AVL tree"
zh = "AVL 树"
notes = "Adel'son-Vel'skii 与 Landis 1962 年提出：每个节点的左右子树高度差不超过 1"

[[term]]
en = "AVL sort"
zh = "AVL 排序"
notes = "把元素逐个插进 AVL 树，再中序遍历读出；两步合计 Θ(n lg n)"

[[term]]
en = "rotation"
zh = "旋转"
notes = "AVL 修复高度的基本动作；一次旋转只改动常数个指针，单旋或双旋"

[[term]]
en = "right-heavy"
zh = "右重"
notes = "右子树比左子树高；讲义里只说 x 右重的情形，左重的按左右镜像处理"

[[term]]
en = "in-order traversal"
zh = "中序遍历"
notes = "先左子树、再根、后右子树；在二叉搜索树上读出的就是排好序的序列"

[[term]]
en = "abstract data type"
zh = "抽象数据类型"
notes = "ADT：只规定有哪些操作、各自什么语义，不规定怎么实现"

[[term]]
en = "Fibonacci number"
zh = "斐波那契数"
notes = "最瘦的 AVL 树节点数按它增长，通项里带黄金比例"

[[term]]
en = "golden ratio"
zh = "黄金比例"
notes = "φ = (1+√5)/2 ≈ 1.618；AVL 树的最大高度约为 logφ n ≈ 1.440 lg n"

# ── 第 8 讲（哈希与链地址法）新增 ──────────────────────────────────────────

[[term]]
en = "hashing"
zh = "哈希"
notes = "把整个键域 U 压到 m 个槽里；键域大而表小，所以必然有键挤到一起"

[[term]]
en = "prehashing"
zh = "预哈希"
notes = "对付「键必须是非负整数」：把任意对象编码成整数，Python 的 hash( ) 干的就是这件事"

[[term]]
en = "direct access table"
zh = "直接访问表"
notes = "用键直接当数组下标：一步取到，但要求键是非负整数，而且键域不能大"

[[term]]
en = "chaining"
zh = "链地址法"
notes = "每个槽挂一条链表，串起所有哈希到该槽的元素；本讲只讲这一条路"

[[term]]
en = "open addressing"
zh = "开放寻址"
notes = "对付碰撞的第二条路；讲义把它留给第 10 讲，本讲不展开"

[[term]]
en = "simple uniform hashing"
zh = "简单均匀哈希"
notes = "一个假设：每个键落到任何槽都等可能，且与其他键落在哪里无关；讲义自己把它标成 cheating"

[[term]]
en = "load factor"
zh = "装填因子"
notes = "α = n/m，既是每个槽的期望键数，也是每条链的期望长度；查找的期望代价是 Θ(1 + α)"

[[term]]
en = "division method"
zh = "除法法"
notes = "h(k) = k mod m；m 取质数且别贴着 2 或 10 的幂，但找质数不方便、除法也慢"

[[term]]
en = "multiplication method"
zh = "乘法法"
notes = "h(k) = [(a·k) mod 2^w] ≫ (w − r)，其中 m = 2^r；a 取随机奇数，乘法与取位比除法快"

[[term]]
en = "universal hashing"
zh = "全域哈希"
notes = "h(k) = [(ak + b) mod p] mod m，a 与 b 随机、p 是大于 |U| 的大质数；任两个不同的键碰撞概率恰为 1/m"

# ── 第 7 讲（计数排序、基数排序与下界）新增 ────────────────────────────────

[[term]]
en = "comparison model"
zh = "比较模型"
notes = "输入元素当黑盒（ADT），只允许比较，代价记作比较次数；两条下界都只在这个模型里成立"

[[term]]
en = "decision tree"
zh = "判定树"
notes = "把某个 n 下所有比较结果与对应输出画成的二叉树：内部节点一次比较、叶子一个输出、树高是最坏情况的运行时间"

[[term]]
en = "least significant digit"
zh = "最低位数字"
notes = "基数排序的起点：先按它排一遍，再往高位走；取某一位是 O(1) 的随机访问"

[[term]]
en = "most significant digit"
zh = "最高位数字"
notes = "基数排序的终点；走到它，整个序列才真正有序"

# ── 第 9 讲（表倍增与 Karp-Rabin）新增 ──────────────────────────────────────

[[term]]
en = "table doubling"
zh = "表倍增"
notes = "表满（n 追上 m）就把槽数翻倍的做法；n 次插入的总代价从每次加一的 Θ(n²) 降到 Θ(n)"

[[term]]
en = "rehashing"
zh = "重哈希"
notes = "改表尺寸就必须换哈希函数（m 与 r 都会变），于是旧表要逐槽重算搬到新表，代价 Θ(n + m)"

[[term]]
en = "rolling hash"
zh = "滚动哈希"
notes = "维护一段字符串的哈希值，支持末尾追加与从前面删除；两个动作都只要常数时间，窗口滑动时不必重算整段"

[[term]]
en = "string matching"
zh = "字符串匹配"
notes = "判断短串 s 是否作为子串出现在长串 t 里，以及出现的位置与次数"

[[term]]
en = "Karp-Rabin algorithm"
key = "karp-rabin"
zh = "卡普-拉宾算法"
notes = "先比哈希值、只有哈希相等才逐字符核对的字符串匹配算法；用滚动哈希把每个窗口的哈希做到 O(1)"

# ── 第 10 讲（开放寻址与密码学哈希）新增 ────────────────────────────────────

[[term]]
en = "probing"
zh = "探测"
notes = "开放寻址里「按探测序列试下一个槽」这个动作；插入探到空槽为止，查找探到命中或空槽为止"

[[term]]
en = "probe sequence"
zh = "探测序列"
notes = "h(k, 0), h(k, 1), …, h(k, m−1) 这一串槽；它必须是 0 到 m−1 的一个排列，否则会漏掉槽或兜圈子"

[[term]]
en = "linear probing"
zh = "线性探测"
notes = "h(k, i) = (h′(k) + i) mod m：从一个起点开始每次往后挪一格；简单但会产生聚簇，讲义把它比作街边找车位"

[[term]]
en = "double hashing"
zh = "双重哈希"
notes = "h(k, i) = (h1(k) + i·h2(k)) mod m：h1 定起点、h2 定步长；h2(k) 与 m 互质时仍能试遍所有槽，m 取 2 的幂时只要 h2 是奇数"

[[term]]
en = "clustering"
zh = "聚簇"
notes = "一连串被占满的槽；聚簇越长，下一个键落进来、把它再拉长的机会越大，线性探测因此退化"

[[term]]
en = "uniform hashing assumption"
zh = "均匀哈希假设"
notes = "每个键的探测序列在 m! 个排列里等可能；讲义自己写 not really true，但说双重哈希能接近它"

[[term]]
en = "tombstone"
zh = "墓碑标记"
notes = "删除时留在槽里的标记（讲义叫 DeleteMe）：插入把它当空位，查找不把它当空位，否则会把探测链切断"

[[term]]
en = "cryptographic hash function"
zh = "密码学哈希函数"
notes = "任意长度的数据进去、固定长度的比特串出来，数据改一点输出就该变；讲义说它比哈希表里用的那种复杂得多"

[[term]]
en = "one-way"
zh = "单向性"
notes = "OW：给定输出 y 找不出任何 x 使 h(x) = y；存口令只用得到这一条，与抗碰撞性之间没有蕴含关系"

[[term]]
en = "collision resistance"
zh = "抗碰撞性"
notes = "CR：找不出两个不同的输入 x ≠ x′ 使哈希值相等；它蕴含目标抗碰撞性，数字签名要的就是这一条"

[[term]]
en = "target collision resistance"
zh = "目标抗碰撞性"
notes = "TCR：给定一个 x，找不出另一个 x′ 与它撞上；比抗碰撞性弱，查文件有没有被改要的是这一条"

[[term]]
en = "message digest"
zh = "消息摘要"
notes = "密码学哈希输出的别名；输入那段数据叫消息，出来的定长比特串也叫摘要"

[[term]]
en = "digital signature"
zh = "数字签名"
notes = "用私钥对消息签名、别人用公钥验证；消息很长时改成对它的哈希值签名，于是需要抗碰撞性"

# ── 第 11、12 讲：数值计算（无理数、牛顿法、高精度乘法）────────────────
[[term]]
en = "irrational number"
zh = "无理数"
notes = "不能写成两个整数之比的实数；√2 是最早的例子，讲义从正方形的对角线与边长讲起"

[[term]]
en = "square root"
zh = "平方根"
notes = "满足 x² = a 的那个非负数；这一讲用牛顿法迭代求它，误差每步大约平方"

[[term]]
en = "Newton's method"
zh = "牛顿法"
notes = "解 f(x) = 0 的迭代办法：在当前点画切线，取切线与横轴的交点当作下一站"

[[term]]
en = "tangent line"
zh = "切线"
notes = "曲线在某点处的切线，斜率就是该点的导数；牛顿法的一步就是解它与横轴的交点"

[[term]]
en = "quadratic convergence"
zh = "二次收敛"
notes = "误差每步大约变成原来的平方，于是有效位数每步大约翻倍；牛顿法在根附近有这条性质"

[[term]]
en = "high-precision arithmetic"
zh = "高精度运算"
notes = "位数远超一个机器字时的加减乘除；这一讲做乘法，除法留给第 12 讲"

[[term]]
en = "radix"
zh = "进位制基数"
notes = "记作 r，取 2 就是二进制、取 10 就是十进制；拆半与移位都按 r 的幂来做"

[[term]]
en = "high half"
zh = "高半段"
notes = "n 位数拆成两半后带着 r 的 n/2 次方的那个一半，讲义记作 x_1 与 y_1"

[[term]]
en = "low half"
zh = "低半段"
notes = "n 位数拆成两半后不带 r 的幂的那个一半，讲义记作 x_0 与 y_0"

[[term]]
en = "Karatsuba multiplication"
zh = "Karatsuba 乘法"
notes = "把两个 n 位数相乘的子问题从 4 个减到 3 个，代价从 θ(n²) 降到 n 的 log₂3 次方"

[[term]]
en = "branching factor"
zh = "分支因子"
notes = "递归树上每个节点分出几个子问题；它决定叶子数，也就是代价里的指数"

[[term]]
en = "balanced parentheses"
zh = "平衡括号串"
notes = "左括号与右括号能配对的串；每条非空串唯一地拆成 (α)β，由此得到卡塔兰数的递推式"

[[term]]
en = "Catalan number"
zh = "卡塔兰数"
notes = "恰好 n 对括号的平衡串个数，1, 1, 2, 5, 14, 42 …；第 11 讲的几何题算到几百位时每 24 位出现一个"

[[term]]
en = "power series"
zh = "幂级数"
notes = "形如 c_0 + c_1x + c_2x² + … 的无穷和；讲义用 Q(x) = 1 + xQ(x)² 说明系数为什么是卡塔兰数"
