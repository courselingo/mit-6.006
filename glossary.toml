[[term]]
en = "priority queue"
zh = "优先队列"
notes = "按优先级取元素；堆是常见实现"

[[term]]
en = "binary search tree"
zh = "二叉搜索树"

[[term]]
en = "balanced tree"
zh = "平衡树"
